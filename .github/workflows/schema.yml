name: schema

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  neuaufbau:
    name: neuaufbau
    runs-on: ubuntu-latest

    services:
      postgres:
        # Hauptversion an DREI Stellen, sie muessen zusammen wandern:
        # hier, im awk-Filter des Schritts "pgTAP bereitstellen" und im
        # Paketnamen postgresql-<N>-pgtap. Der services-Block kennt den
        # env-Kontext nicht, deshalb steht die Zahl ausgeschrieben.
        #
        # 16 -> 18 am 2026-09-03: die Entwicklungsrechner fahren 18.x, der
        # Schnappschuss in supabase/schema-erwartet.sql wird also von pg_dump 18
        # erzeugt. Der Vergleich unten siebt zwar alle Kommentarzeilen weg (und
        # damit die Versionskennung), nicht aber Formatunterschiede zwischen
        # Hauptversionen. Gleiche Version auf beiden Seiten nimmt diese Klasse
        # von Fehlalarmen ganz heraus.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuaufbau
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: neuaufbau

    steps:
      - uses: actions/checkout@v4

      - name: Namensschema und Ablage prüfen
        run: |
          fehler=0
          if [ -d supabase/pending ]; then
            echo "::error::supabase/pending/ existiert wieder — das Verzeichnis ist abgeschafft."
            fehler=1
          fi
          for f in supabase/migrations/*.sql; do
            b=$(basename "$f" .sql)
            case "$b" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*) ;;
              *) echo "::error file=$f::Name muss <14 Ziffern>_<name>.sql sein"; fehler=1 ;;
            esac
            case "$b" in
              *.PRUEFUNG|*.E2E)
                echo "::error file=$f::Prüfskripte gehören nach supabase/checks/"
                fehler=1 ;;
            esac
          done
          exit $fehler

      - name: Grundlage
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test-grundlage.sql

      - name: Migrationen einspielen
        run: |
          fehler=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            if psql -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null 2>/tmp/err; then
              echo "  ok   $(basename "$f")"
            else
              echo "::error file=$f::Migration scheitert auf leerer Datenbank"
              grep -vE '^(NOTICE|HINWEIS)' /tmp/err | head -25
              fehler=1
              break
            fi
          done
          exit $fehler

      - name: Schema gegen erwarteten Stand vergleichen
        run: |
          if [ ! -f supabase/schema-erwartet.sql ]; then
            echo "::warning::supabase/schema-erwartet.sql fehlt — Vergleich übersprungen."
            echo "Erzeugen mit: bash tools/schema-snapshot.sh"
            exit 0
          fi
          pg_dump --schema-only --no-owner --no-acl --no-comments --schema public \
            | grep -vE '^--|^$|^SET |^SELECT pg_catalog|restrict ' | sort > /tmp/ist.txt
          grep -vE '^--|^$|^SET |^SELECT pg_catalog|restrict ' supabase/schema-erwartet.sql \
            | sort > /tmp/soll.txt
          if diff -q /tmp/soll.txt /tmp/ist.txt >/dev/null; then
            echo "Schema entspricht supabase/schema-erwartet.sql"
          else
            echo "::error::Erzeugtes Schema weicht von supabase/schema-erwartet.sql ab."
            echo "Nach einer Schemaänderung neu erzeugen: bash tools/schema-snapshot.sh"
            echo
            echo "── erwartet, aber nicht erzeugt:"
            comm -23 /tmp/soll.txt /tmp/ist.txt | head -40
            echo
            echo "── erzeugt, aber nicht erwartet:"
            comm -13 /tmp/soll.txt /tmp/ist.txt | head -40
            exit 1
          fi

      # ── Ab hier laufen die SQL-Tests. Sie kommen bewusst NACH dem
      #    Schemavergleich: pgTAP legt rund tausend Funktionen an, und die
      #    Seed-Daten fuellen Tabellen. Beides soll den Abzug nicht beruehren.

      - name: pgTAP bereitstellen
        run: |
          cid=$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:18/ {print $1; exit}')
          if [ -z "$cid" ]; then
            echo "::error::Postgres-Dienstcontainer nicht gefunden — pgTAP nicht installierbar."
            docker ps
            exit 1
          fi
          # Das offizielle postgres-Image traegt die PGDG-Quelle bereits.
          docker exec "$cid" bash -c \
            'apt-get update -qq && apt-get install -y -qq postgresql-18-pgtap' >/dev/null
          psql -v ON_ERROR_STOP=1 -q -c 'create schema if not exists extensions'
          psql -v ON_ERROR_STOP=1 -q -c 'create extension if not exists pgtap with schema extensions'
          echo "pgTAP $(psql -tAc "select extversion from pg_extension where extname='pgtap'")"

      - name: Katalogdaten
        run: |
          # Die Tests legen ihre Fixtures selbst an, haengen sie aber an
          # skill_clusters/subjects — die kommen aus seed.sql, nicht aus den
          # Migrationen. Ohne diesen Schritt liefern die \gset-Abfragen NULL und
          # psql scheitert an nicht ersetzten :'variablen'.
          # supabase/seeds/*.sql (Aufgabenbestand) braucht keiner der Tests, die
          # hier gruen laufen — bewusst nicht geladen, das spart eine Minute.
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      - name: Invariantentests (pgTAP)
        env:
          # pgTAP liegt in `extensions`; die Tests rufen plan()/ok()/is()
          # unqualifiziert auf. In Supabase steht das im search_path der
          # Datenbank, in einem nackten Postgres nicht.
          PGOPTIONS: -c search_path=public,extensions
        run: |
          liste=supabase/tests/bekannt-rot.txt
          fehler=0
          for f in $(ls supabase/tests/*.test.sql | sort); do
            b=$(basename "$f" .test.sql)
            if out=$(psql -X -q -t -A -v ON_ERROR_STOP=1 -f "$f" 2>&1) \
               && ! grep -qE '^not ok|^# Looks like' <<<"$out"; then
              stand=gruen
            else
              stand=rot
            fi
            if grep -qE "^$b([[:space:]]|$)" "$liste"; then
              if [ "$stand" = gruen ]; then
                echo "::error file=$liste::$b laeuft wieder gruen — Zeile aus $liste entfernen."
                fehler=1
              else
                echo "  wartet $b — $(grep -E "^$b([[:space:]]|$)" "$liste" | sed 's/^[^#]*#[[:space:]]*//')"
              fi
              continue
            fi
            if [ "$stand" = gruen ]; then
              echo "  ok     $b ($(grep -cE '^ok ' <<<"$out") Zusicherungen)"
            else
              echo "::error file=$f::$b ist rot"
              grep -E '^not ok|^#|ERROR|FEHLER' <<<"$out" | head -15
              fehler=1
            fi
          done
          exit $fehler

      - name: Prüfskripte gegen den Neuaufbau
        run: |
          # Nur die Skripte aus supabase/checks/, die fuer eine leere
          # Neuaufbau-Datenbank geschrieben sind (Testdaten selbst anlegen,
          # eigenes begin/rollback). Die uebrigen pruefen gegen
          # Produktionsinhalte — Begruendung im PR.
          #
          # AF4 (2026-08-14) haengt zwei dazu: die Familien-Pruefung und die
          # Abnahme-Pruefung. Beide laufen gegen eine leere Datenbank, weil die
          # Bestueckung (5 Familien, 20 Fehlbilder) per Upsert aus der Migration
          # selbst kommt und nicht aus Produktionsinhalten. P5 eine dritte: das
          # erste MULTI_PART-Item mit acceptance, aus demselben Grund.
          #
          # tiers_preise_frequenzen (2026-08-18) aus demselben Grund: die drei
          # Tarife kommen per Upsert aus der Migration. Sie laeuft bewusst NACH
          # dem Seed-Schritt — seed.sql traegt noch die alten Zahlen und wird
          # nur durch seinen `where not exists`-Waechter wirkungslos. Genau das
          # halten T1/T2 fest.
          fehler=0
          for f in supabase/checks/fehlbild_auswertung.PRUEFUNG.sql \
                   supabase/checks/fehlbild_klartext_abnahme.PRUEFUNG.sql \
                   supabase/checks/fehlbild_familien.PRUEFUNG.sql \
                   supabase/checks/gleichung_modellieren_item1.PRUEFUNG.sql \
                   supabase/checks/gleichung_modellieren_items2_10.PRUEFUNG.sql \
                   supabase/checks/fehlbild_capture_formen.PRUEFUNG.sql \
                   supabase/checks/urteil_multipart.PRUEFUNG.sql \
                   supabase/checks/jwt_identitaet.PRUEFUNG.sql \
                   supabase/checks/tiers_preise_frequenzen.PRUEFUNG.sql; do
            if psql -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null 2>/tmp/perr; then
              echo "  ok   $(basename "$f")"
            else
              echo "::error file=$f::Prüfskript scheitert"
              grep -vE '^(NOTICE|HINWEIS)' /tmp/perr | head -20
              fehler=1
            fi
          done
          exit $fehler
