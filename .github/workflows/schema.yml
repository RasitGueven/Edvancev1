name: schema

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/test-grundlage.sql'
      - '.github/workflows/schema.yml'
  push:
    branches: [dev, main]
    paths:
      - 'supabase/migrations/**'

jobs:
  neuaufbau:
    name: neuaufbau
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuaufbau
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: neuaufbau

    steps:
      - uses: actions/checkout@v4

      - name: Namensschema und Ablage prüfen
        run: |
          fehler=0
          if [ -d supabase/pending ]; then
            echo "::error::supabase/pending/ existiert wieder — das Verzeichnis ist abgeschafft."
            fehler=1
          fi
          for f in supabase/migrations/*.sql; do
            b=$(basename "$f" .sql)
            case "$b" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*) ;;
              *) echo "::error file=$f::Name muss <14 Ziffern>_<name>.sql sein"; fehler=1 ;;
            esac
            case "$b" in
              *.PRUEFUNG|*.E2E)
                echo "::error file=$f::Prüfskripte gehören nach supabase/checks/"
                fehler=1 ;;
            esac
          done
          exit $fehler

      - name: Grundlage
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/test-grundlage.sql

      - name: Migrationen einspielen
        run: |
          fehler=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            if psql -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null 2>/tmp/err; then
              echo "  ok   $(basename "$f")"
            else
              echo "::error file=$f::Migration scheitert auf leerer Datenbank"
              grep -vE '^(NOTICE|HINWEIS)' /tmp/err | head -25
              fehler=1
              break
            fi
          done
          exit $fehler

      - name: Schema gegen erwarteten Stand vergleichen
        run: |
          if [ ! -f supabase/schema-erwartet.sql ]; then
            echo "::warning::supabase/schema-erwartet.sql fehlt — Vergleich übersprungen."
            echo "Erzeugen mit: bash tools/schema-snapshot.sh"
            exit 0
          fi
          pg_dump --schema-only --no-owner --no-acl --no-comments --schema public \
            | grep -vE '^--|^$|^SET |^SELECT pg_catalog|restrict ' | sort > /tmp/ist.txt
          grep -vE '^--|^$|^SET |^SELECT pg_catalog|restrict ' supabase/schema-erwartet.sql \
            | sort > /tmp/soll.txt
          if diff -q /tmp/soll.txt /tmp/ist.txt >/dev/null; then
            echo "Schema entspricht supabase/schema-erwartet.sql"
          else
            echo "::error::Erzeugtes Schema weicht von supabase/schema-erwartet.sql ab."
            echo "Nach einer Schemaänderung neu erzeugen: bash tools/schema-snapshot.sh"
            echo
            echo "── erwartet, aber nicht erzeugt:"
            comm -23 /tmp/soll.txt /tmp/ist.txt | head -40
            echo
            echo "── erzeugt, aber nicht erwartet:"
            comm -13 /tmp/soll.txt /tmp/ist.txt | head -40
            exit 1
          fi
