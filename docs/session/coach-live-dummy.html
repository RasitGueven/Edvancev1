<title>Edvance Coach-Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: Dummy-Leiste oben, darunter ein iPad-Rahmen (quer oder hoch) oder die ganze Breite.
   Darin die Coach-Live-Sicht als Fokus-Seite ohne Leiste: Kopf mit Uhr, Phasenleiste, darunter je Zeitpunkt eine Ansicht.
   Coach-Sprache = Eltern-Sprache des Design-Systems: flach, kein Glas, 150 ms ease-out, heller Grund.
   Bewusst nur hell wie die Admin-Hülle. Farben aus edvance-app/src/design/tokens.ts und dem Design-System. */
:root{
  --navy:#334D7A; --navy-hover:#253D6A; --navy-light:#EEF2F8; --navy-line:#D3DCEA; --on-cream:#1A2E4A;
  --cream:#F7F5EE; --gold:#D4A843;
  --bg:#F7F7F5; --surface:#FFFFFF; --subtle:#EFEFED; --hover:#FAFAF8; --border:#E8E8E5; --line:#DCDCD8;
  --t1:#1A1A18; --t2:#4A4A47; --t3:#888884;
  --ok:#2A8A4A; --ok-bg:#EAF5EE; --right:#27AE60; --wrong:#C03030; --wrong-bg:#FADEDC;
  --warn:#C87E00; --warn-bg:#FEF3E2; --warn-line:#F0D29A;
  --hint-bg:#FBF6EA; --hint-line:#D4A843; --hint-ink:#7A5610;
  --stage:#E3E6EB; --bezel:#0B111F; --scrim:rgba(11,17,31,.42);
  --sh-xs:0 1px 3px rgba(51,77,122,.06); --sh-md:0 4px 12px rgba(51,77,122,.10);
  --sh-lg:0 8px 24px rgba(51,77,122,.15); --sh-xl:0 8px 32px rgba(51,77,122,.35);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--t1);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.muted{color:var(--t3)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.lab{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}

/* ========== Dummy-Leiste (nicht Teil der App) ========== */
.dbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-inline:16px;padding-block:10px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:5}
.dbar .tt{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.dbar .tt b{font-family:var(--f-display);font-weight:600;font-size:17px}
.dbar .tt span{font-size:12.5px;color:var(--t3)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3);flex-wrap:wrap}
.sgrp{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.sgrp button{border:none;border-left:1px solid var(--line);background:none;padding:7px 11px;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.sgrp button:first-child{border-left:none}
.sgrp button:hover{background:var(--subtle)}
.sgrp button[aria-pressed="true"]{background:var(--navy);color:var(--cream);font-weight:600}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;color:var(--t2);cursor:pointer}
.sw .knob{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:left .15s var(--ease)}
.sw[aria-pressed="true"]{border-color:var(--hint-line);color:var(--hint-ink)}
.sw[aria-pressed="true"] .knob{background:var(--hint-line)}
.sw[aria-pressed="true"] .knob::after{left:14px}

/* ========== Bühne und Gerät ========== */
.stage{display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:20px 28px}
.stage.full{padding:0}
.frame{position:relative}
.device{position:absolute;top:0;left:0;transform-origin:top left;background:var(--bg);overflow:hidden}
.stage.full .frame{width:100%}
.stage.full .device{position:relative}
.device.ipad{border-radius:26px;box-shadow:0 0 0 12px var(--bezel),0 24px 60px rgba(11,17,31,.35)}
.devlabel{font-size:12.5px;color:var(--t3);margin-top:22px;text-align:center}
.stage.full .devlabel{display:none}

/* ========== App: Fokus-Seite ========== */
.app{position:relative;display:flex;flex-direction:column;height:100%;background:var(--bg)}
.top{flex:none;display:flex;align-items:center;gap:12px 16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 4px;border:none;background:none;border-radius:var(--r-md);color:var(--navy);font-weight:600;font-size:14px;cursor:pointer}
.back:hover{background:var(--navy-light)}
.top .tt{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.top .tt b{font-family:var(--f-display);font-weight:500;font-size:21px;letter-spacing:-.005em}
.top .tt span{font-size:13px;color:var(--t3)}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;text-align:right}
.clock b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.clock span{font-size:12.5px;color:var(--t3)}

.tline{flex:none;padding:10px 20px 10px;background:var(--surface);border-bottom:1px solid var(--border)}
.tbar{position:relative;display:flex;gap:3px;height:32px}
.pseg{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 4px;border-radius:8px;background:var(--subtle);color:var(--t2);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pseg.done{background:var(--navy-line);color:var(--navy)}
.pseg.now{background:var(--navy);color:var(--cream)}
.tdur{display:flex;gap:3px;margin-top:4px}
.tdur span{min-width:0;text-align:center;font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowmark{position:absolute;top:-7px;bottom:-7px;width:3px;margin-left:-1.5px;border-radius:2px;background:linear-gradient(to bottom,var(--gold) 0 7px,transparent 7px calc(100% - 7px),var(--gold) calc(100% - 7px))}

.body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.inner{container:inner / inline-size;max-width:1400px;margin-inline:auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:18px}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-xs)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sh h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.sh span{font-size:13px;color:var(--t3)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--navy);background:var(--navy);color:var(--cream);font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s var(--ease)}
.btn:hover:not(:disabled){background:var(--navy-hover)}
.btn.ghost{background:var(--surface);color:var(--t1);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--subtle)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.okb:hover:not(:disabled){background:#23753F}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.wide{width:100%}
.link{display:inline-flex;align-items:center;gap:6px;min-height:40px;border:none;background:none;padding:0;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link.sm{font-size:13px;min-height:32px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--subtle);color:var(--t2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--wrong-bg);color:var(--wrong)}
.pill.navy{background:var(--navy-light);color:var(--navy)}
.pill.solid{background:var(--navy);color:var(--cream)}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy-light);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;flex:none}
.seatno{width:24px;height:24px;border-radius:7px;background:var(--subtle);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--t2);cursor:pointer}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--cream);font-weight:600}
dl.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--t3);font-size:13px;padding-top:1px}
dl.kv dd{margin:0;min-width:0}

/* Hinweise und Stellschrauben (Dummy) */
.hint{display:none;border:1.5px dashed var(--hint-line);background:var(--hint-bg);border-radius:var(--r-md);padding:10px 13px;font-size:13px;line-height:1.55;color:var(--t2)}
.hint b{color:var(--hint-ink);font-weight:600;margin-right:4px}
.hint code{font-size:12px;background:rgba(212,168,67,.16);border-radius:4px;padding:0 4px}
body.hints .hint{display:block}
body.scmode .sc{background:var(--hint-bg);color:var(--hint-ink);box-shadow:inset 0 -2px 0 var(--hint-line);border-radius:3px;padding:0 2px;cursor:help}
.pseg .sc,.tile .sc{color:inherit}
body.scmode .pseg.now .sc{background:transparent;color:var(--cream);box-shadow:inset 0 -2px 0 var(--gold)}
.scp{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-color:var(--hint-line);background:var(--hint-bg)}
.scp .sh{margin:0}
.scp .sh h2{color:var(--hint-ink)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--warn-line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--warn-line)}
tr:last-child td{border-bottom:none}

/* ========== Vorher ========== */
.brief{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@container inner (max-width:899px){.brief{grid-template-columns:minmax(0,1fr)}}
.blist{list-style:none;margin:0;padding:0}
.bk{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 16px}
.bk+.bk{border-top:1px solid var(--subtle)}
.bkm{display:flex;flex-direction:column;gap:8px;min-width:0}
.bkh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bkh b{font-size:16px;font-weight:600}
.look{padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px}
.look ul{list-style:none;margin:0;padding:0}
.lk{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--subtle)}
.lk .li{width:36px;height:36px;border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;background:var(--navy-light);color:var(--navy)}
.lk .li.warn{background:var(--warn-bg);color:var(--warn)}
.lk b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.lk span{display:block;font-size:13px;color:var(--t2);line-height:1.45}

/* ========== Check-in ========== */
.room{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.seat{min-height:112px;border:1.5px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center}
.seat.taken{border-style:solid;border-color:var(--navy-line);box-shadow:var(--sh-xs)}
.seat .sn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.seat b{font-size:16px;font-weight:600}
.arrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.arr{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.arr .am{display:flex;flex-direction:column;min-width:0;flex:1 1 140px;line-height:1.35}
.arr .am b{font-weight:600}
.arr .am span{font-size:13px}
.arr .aa{display:flex;gap:6px;flex-wrap:wrap}
.cilist{display:flex;flex-direction:column}
.cirow{display:grid;grid-template-columns:180px 120px minmax(0,1fr) minmax(0,1.4fr);gap:10px 16px;align-items:start;padding:14px 16px}
.cirow+.cirow{border-top:1px solid var(--subtle)}
.cirow .cn{display:flex;align-items:center;gap:8px;font-weight:600}
.cirow .cv{font-size:14px;min-width:0}
.cirow .cv .lab{margin-bottom:2px}
.cirow .cf{grid-column:2/-1;display:flex;flex-direction:column;gap:8px}
@container inner (max-width:1000px){.cirow{grid-template-columns:repeat(3,minmax(0,1fr))}.cirow .cn{grid-column:1/-1}.cirow .cf{grid-column:1/-1}}
.ziel{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t2)}
.ziel b{color:var(--t1);font-weight:600}
.tpick{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--warn-line);border-radius:var(--r-md);padding:12px}
.tin{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;font-size:15px;background:var(--surface)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.tlist:empty{display:none}
.tres{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:52px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);text-align:left;cursor:pointer}
.tres:hover{border-color:var(--navy)}
.tres b{font-size:14.5px;font-weight:600;line-height:1.3}
.tres span{font-size:12.5px;color:var(--t3)}
.tnone{font-size:13.5px;color:var(--t2);padding:4px 2px}
ul.zl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.zl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:start}
.zl i{width:12px;height:12px;border-radius:50%;margin-top:5px;box-shadow:inset 0 0 0 1.5px var(--line)}
.zl .zs-ok i{background:var(--navy);box-shadow:none}
.zl .zs-run i{background:var(--navy-line);box-shadow:inset 0 0 0 1.5px var(--navy)}
.zl .zs-kand i{background:var(--navy);box-shadow:0 0 0 3px var(--navy-light)}
.zl .zs-nns i{background:var(--warn);box-shadow:none}
.zl .zs-gem i{background:var(--ok);box-shadow:none}
.zl div{display:flex;flex-direction:column;line-height:1.35}
.zl b{font-size:14.5px;font-weight:600}
.zl span{font-size:13px;color:var(--t2)}
.mood{display:inline-flex;align-items:center;gap:6px}
.mood i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.mood.ok i{background:var(--right)}
.mood.warn i{background:var(--warn)}
.fseg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;flex-wrap:wrap}
.fseg button{min-height:36px;border:none;border-left:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13px;color:var(--t2);cursor:pointer;position:relative}
.fseg button:first-child{border-left:none}
.fseg button[aria-pressed="true"]{background:var(--navy);color:var(--cream);font-weight:600}
.fseg button .sg{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}

/* ========== Live ========== */
.live{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
@container inner (max-width:899px){.live{grid-template-columns:minmax(0,1fr)}.qsec{order:-1}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-xs);padding:0 0 12px;cursor:pointer;overflow:hidden;min-height:178px;transition:box-shadow .15s var(--ease)}
.tile:hover{box-shadow:var(--sh-md)}
.tile.sel{outline:2px solid var(--navy);outline-offset:1px}
.tband{display:flex;align-items:center;gap:6px;min-height:32px;padding:6px 14px;font-size:12.5px;font-weight:600;background:var(--hover);color:var(--t3);border-bottom:1px solid var(--subtle)}
.tile.s-hang,.tile.s-dec{border-color:var(--warn-line)}
.tile.s-hang .tband,.tile.s-dec .tband{background:var(--warn-bg);color:var(--warn);border-bottom-color:var(--warn-line)}
.tile.s-kand{border-color:var(--navy-line)}
.tile.s-kand .tband{background:var(--navy);color:var(--cream);border-bottom-color:var(--navy)}
.tile.s-info .tband{background:var(--navy-light);color:var(--navy)}
.tile.s-ok{border-color:#BFE0CB}
.tile.s-ok .tband{background:var(--ok-bg);color:var(--ok)}
.thd{display:flex;align-items:center;gap:8px;padding:6px 14px 0}
.thd b{font-size:16px;font-weight:600}
.thd .kl{margin-left:auto;font-size:12.5px;color:var(--t3)}
.tph{padding:0 14px;font-size:12.5px;color:var(--t3)}
.tsk{padding:0 14px;font-size:14.5px;font-weight:500;line-height:1.35}
.tprog{display:flex;align-items:center;gap:8px;padding:2px 14px 0;font-size:12.5px;color:var(--t2)}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%}
.dots i.r{background:var(--right)}
.dots i.w{background:var(--wrong)}
.dots i.h{background:linear-gradient(90deg,var(--right) 50%,var(--surface) 50%);box-shadow:inset 0 0 0 1.5px var(--right)}
.dots i.n{box-shadow:inset 0 0 0 1.5px var(--line)}
.seqbar{display:flex;gap:4px;flex:1;max-width:120px}
.seqbar i{flex:1;height:7px;border-radius:4px;background:var(--subtle)}
.seqbar i.ok{background:var(--navy)}
.seqbar i.run{background:var(--navy-line)}
.tmeta{padding:0 14px;font-size:12.5px;color:var(--t3);margin-top:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--t3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.queue{list-style:none;margin:0;padding:6px}
.queue li+li{border-top:1px solid var(--subtle)}
.qb{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:62px;padding:8px 10px;border:none;background:none;border-radius:var(--r-md);text-align:left;cursor:pointer}
.qb:hover{background:var(--hover)}
.qn{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--subtle);color:var(--t2)}
.qb.p0 .qn{background:var(--navy);color:var(--cream)}
.qb.p1 .qn,.qb.p2 .qn{background:var(--warn-bg);color:var(--warn)}
.qb.p3 .qn{background:var(--navy-light);color:var(--navy)}
.qt{min-width:0}

const fold=s=>String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
function searchThemen(q,st){
  const ws=fold(q).split(/\s+/).filter(Boolean);if(!ws.length)return [];
  const hit=(words,w)=>words.some(x=>x.startsWith(w));
  return THEMEN.map(t=>{const lw=fold(t.l).split(/[\s:,]+/),kw=t.kw.map(fold);
      const rank=ws.every(w=>hit(lw,w))?0:ws.every(w=>hit(lw,w)||hit(kw,w))?1:null;
      return rank===null?null:{...t,rank};}).filter(Boolean)
    .sort((a,b)=>a.rank-b.rank||(a.st===st?0:1)-(b.st===st?0:1)).slice(0,6);
}
function themaOf(id){return S.thema[id]||(CI[id].neu?null:CI[id].thema);}

function fallOf(id){return S.fall[id]||CI[id].fall;}
function fallLabel(id){return FALL.find(f=>f[0]===fallOf(id))[1];}
function zielText(id,live){
  const f=fallOf(id),c=CI[id],th=live?themaLive(id):themaOf(id);

}

  const arr=waiting.length?`<div class="arrs">${waiting.map(k=>{const da=S.arrived[k.id];
    return `<div class="card arr"><span class="av">${ini(k.name)}</span><div class="am"><b>${k.name}</b><span class="muted">${da?"ist da, noch ohne Platz":"erwartet · noch nicht da"}</span></div>

    :`<div class="card qempty">${I("checkc")} Alle fünf haben einen Platz.</div>`;

    const st=late?`<span class="pill">füllt aus am Tablet</span>`:`<span class="pill ok">${I("check","sm")}fertig · Warm-up</span>`;
    const thema=th?`<b>${TH[th].l}</b>`:c.neu?`<span style="color:var(--warn)">bisher ${TH[c.thema].l}, neues Thema wählen</span>`:"–";
    return `<div class="cirow"><div class="cn"><span class="seatno">${seatOf(id)}</span>${KID[id].name}</div>
      <div class="cv"><span class="lab">Stimmung</span>${late?"–":`<span class="mood ${c.mood[0]}"><i></i>${c.mood[1]}</span>`}${c.mood[0]==="warn"&&!late?`<div class="small" style="color:var(--warn)">kurz ansprechen</div>`:""}</div>
      <div class="cv"><span class="lab">Klassenarbeit</span>${late?"–":c.ka}</div>
      <div class="cv"><span class="lab">Schulthema · ${first(id)} sagt: ${late?"–":c.said}</span><div class="row">${thema}${th&&!open?`<button type="button" class="link sm" onclick="togglePick('${id}')">Ändern</button>`:""}</div></div>
      ${open?picker(id):""}
      <div class="cv cf"><span class="lab">Fall${S.fall[id]&&S.fall[id]!==c.fall?" · von dir geändert":""}</span><div class="row"><div class="fseg" role="group" aria-label="Fall für ${first(id)}">${fseg}</div>${st}</div>
        <div class="ziel">${I("flag","sm")}<span>Ziel der Stunde: <b>${zielText(id)}</b></span></div></div></div>`;}).join("");
  return `<section><div class="sh"><h2>Raum 1 · Plätze</h2><span>${seated.length} von 5 belegt</span></div><div class="room">${room}</div></section>

  ${hint(`Zwei Arten von Platz (R0): Der Session-Platz ist die Buchung in <code>session_students</code> (Admin bzw. Slots, Vertragsprüfung per Trigger ZG001) und steht hier schon fest. Hier weist der Coach das Tablet zu. Das gibt es heute nur für die LSA (<code>platz_assignments</code> → <code>lsa_sessions</code>) und muss auf <code>coaching_sessions</code> erweitert werden. Das Kind meldet sich nicht an: Mit dem Tablet weiß das System, wer davor sitzt. Die Zuweisung setzt die Anwesenheit auf „anwesend“. Offen aus R0: Antworten laufen am Kiosk noch unter dem Konto, das zugewiesen hat.`)}
  <section><div class="sh"><h2>Check-in am Tablet</h2><span>Das Warm-up startet von selbst, sobald ein Kind fertig ist</span></div><div class="card cilist">${rows||`<div class="qempty muted">Noch niemand im Raum.</div>`}</div></section>
  ${hint(`Stimmung, Klassenarbeit und „Macht ihr noch dasselbe Thema?“ beantwortet das Kind am Tablet (neu in R1). Nennt es ein neues Thema, wählt der Coach es mit derselben Suche wie im Erstgespräch: Name und Schlagworte, Stufe des Kindes zuerst, höchstens sechs Vorschläge, kein Freitext. Gespeichert wird es in <code>lead_themen</code> als „aktuell“, das alte Thema wird „behandelt“. Keine Hausaufgaben in der Session (Entscheidung 06.10.).`)}
  ${hint(`Der Fall legt das Ziel der Stunde fest, Rangfolge Klassenarbeit vor Schulthema vor Lernpfad; der goldene Punkt markiert den Vorschlag des Systems. Eine Klassenarbeit zählt erst, wenn sie nah genug ist (bei Emir in drei Wochen, deshalb Schulthema). Ziel heißt: Das Kind durchdringt dieses Thema. Die Auswahl arbeitet wie die LSA vom Einstieg des Themas (<code>thema_einstieg</code>) abwärts zu fehlenden Voraussetzungen (<code>skill_kante</code>). Das Warm-up fragt die Voraussetzungen ab, die Exit-Aufgaben prüfen das Thema. Das Ziel bleibt über Sessions bestehen, bis sich das Thema ändert. Ändert der Coach den Fall, wird das getrennt vom Vorschlag gespeichert.`)}`;
}

/* ================= Live (Warm-up und Kernarbeit) ================= */
function tileData(id,st){
  let d={...(id==="emir"&&st==="kern"&&S.emirPfad==="tiefer"?LIVE.kernEmirT:LIVE[st][id])};
  if(id==="emir"&&st==="warmup"&&S.emirPfad){d.st="";d.stt="";d.meta=S.emirPfad==="tiefer"?"Kernarbeit beginnt eine Stufe tiefer":"Kernarbeit bleibt beim Plan";}
  if(id==="mila"){const m=S.mastery.mila;
    if(m&&m.res==="ok"){d.st="ok";d.stt="gemeistert: Hypotenuse berechnen";}
    else if(m&&m.res==="vertagt"){d.st="";d.stt="";d.meta="Mastery-Prüfung vertagt";}}
  if(S.done.has(id)&&(d.st==="hang"||d.st==="info")){d.st="";d.stt="";d.meta=id==="lea"?"angesprochen":"Signal erledigt";}
  return d;
}
function tile(id,st){
  const k=KID[id],d=tileData(id,st);
  const band=d.stt?fmt(d.stt):"läuft";
  const prog=d.seq?`<span class="seqbar" aria-hidden="true">${d.seq.map(s=>`<i class="${s}"></i>`).join("")}</span>`:dots(d.dots);
  return `<button type="button" class="tile s-${d.st||"run"}${S.sel===id?" sel":""}" onclick="openKid('${id}')" aria-label="${k.name} öffnen">
    <span class="tband">${d.st==="kand"?I("award","sm"):d.st==="hang"||d.st==="dec"?I("alert","sm"):d.st==="ok"?I("checkc","sm"):""}${band}</span>
    <span class="thd"><span class="seatno">${seatOf(id)}</span><b>${first(id)}</b><span class="kl">Kl. ${k.kl}</span></span>
    <span class="tph">${fmt(d.ph)}</span>
    <span class="tsk">${d.sk}</span>
    <span class="tprog">${prog}${d.n?`<span>${d.n}</span>`:""}</span>
    <span class="tmeta">${fmt(d.meta||"")}</span>
  </button>`;
}
function queue(st){
  const Q=st==="warmup"?QW:QK;
  return Object.entries(Q).filter(([id])=>{
    if(S.done.has(id))return false;
    if(id==="mila"&&S.mastery.mila&&S.mastery.mila.res)return false;
    if(id==="emir"&&st==="warmup"&&S.emirPfad)return false;
    if(id==="emir"&&st==="kern"&&S.emirPfad==="tiefer")return false;
    return true;}).sort((a,b)=>a[1].p-b[1].p).map(([id,q])=>({id,...q}));
}
function vLive(){
  const st=S.step,q=queue(st);
  const tiles=bySeat().map(k=>tile(k.id,st)).join("");
  const decided=Object.values(S.mastery).filter(m=>m.res).length;
  const ql=q.length?`<ol class="queue">${q.map((x,i)=>`<li><button type="button" class="qb p${x.p}" onclick="openKid('${x.id}')"><span class="qn">${i+1}</span><span class="qt"><b>${first(x.id)} · ${x.t}</b><span>${fmt(x.s)}</span></span><span class="age">${x.age}</span></button></li>`).join("")}</ol>`
    :`<div class="qempty">${I("checkc")} Nichts offen. Alle arbeiten.</div>`;
  return `<div class="live">
    <section><div class="sh"><h2>Raum 1 · ${st==="warmup"?"Warm-up":"Kernarbeit"}</h2><span>Kind antippen für Details</span></div>
      <div class="tiles">${tiles}</div>
      <div class="legend"><span>${dots("r")}richtig</span><span>${dots("w")}falsch</span><span>${dots("h")}richtig mit Hinweis</span><span>${dots("n")}aktuelle Aufgabe</span></div>
      ${hint(`Statusfarbe nur aus Zuständen: neutral läuft, Bernstein hängt oder braucht eine Entscheidung, Navy Mastery-Prüfung. Grün erscheint erst, wenn der Coach bestätigt hat (Regel 6 des Design-Systems). Wer produktiv ringt, erzeugt kein Signal: Erst die Schwellen aus den Stellschrauben lösen eines aus. Realtime ist nicht eingerichtet (C0: <code>pg_publication_tables</code> leer). Vorschlag: eine Lesefunktion für den ganzen Raum, alle paar Sekunden abgefragt. Antworten, Versuche und Hinweisnutzung für Sessions werden heute nirgends gespeichert (R0, C0) und kommen mit R1.`)}
    </section>
    <aside class="qsec"><div class="sh"><h2>Als Nächstes</h2><span>${q.length} offen</span></div>
      <div class="card">${ql}</div>
      <div class="kcount">Mastery-Prüfungen in dieser Session: ${decided} von ${sc("kand","3")}</div>
      ${hint(`Reihenfolge: Mastery-Prüfungen vor Entscheidungen vor Kindern, die hängen, vor Hinweisen; bei gleicher Art das älteste Signal zuerst. So wird die Prüfung nicht zur Formalität, wenn es voll wird. Ein erledigtes Signal verschwindet, der Eingriff bleibt im Verlauf.`)}
    </aside>
  </div>`;
}

/* ================= Detail ================= */
function inQueue(id){return queue(S.step).some(x=>x.id===id);}
function masteryBlk(){
  const m=S.mastery.mila||{},M=MASTERY;
  if(m.res==="ok")return `<section class="blk kand"><div class="bh"><h3>Mastery-Prüfung</h3></div>
    <div class="res ok">${I("checkc")}<div><b>Gemeistert: ${M.skill}</b><span>bestätigt von Sara um ${m.t}</span></div></div>
    <p class="muted small">Mila sieht das Abzeichen jetzt auf ihrem Tablet.</p>
    <div class="row"><button type="button" class="link sm" onclick="undoM()">Rückgängig</button></div></section>`;
  if(m.res==="vertagt")return `<section class="blk"><div class="bh"><h3>Mastery-Prüfung</h3></div>
    <div class="res">${I("clock")}<div><b>Vertagt: ${M.skill}</b><span>${m.grund} · ${m.t}</span></div></div>
    <p class="muted small">Der Skill wird in einer späteren Session wieder vorgeschlagen.</p>
    <div class="row"><button type="button" class="link sm" onclick="undoM()">Rückgängig</button></div></section>`;
  const steps=[["frage","Prüffrage gestellt"],["erkl","Mila hat ihren Weg selbst erklärt"]].map(([k,l])=>`<button type="button" class="mst" aria-pressed="${S.mchk[k]}" onclick="S.mchk.${k}=!S.mchk.${k};render()"><span class="bx">${S.mchk[k]?I("check","sm"):""}</span>${l}</button>`).join("");
  const vt=S.vopen?`<div class="msteps"><span class="lab">Grund fürs Vertagen</span><div class="chips">${M.gruende.map((g,i)=>`<button type="button" class="chip" aria-pressed="${S.vgrund===g}" onclick="setGrund(${i})">${g}</button>`).join("")}</div>
    <div class="row"><button type="button" class="btn sm" ${S.vgrund?"":"disabled"} onclick="decide('vertagt')">Vertagen</button><button type="button" class="btn sm ghost" onclick="S.vopen=false;S.vgrund=null;render()">Abbrechen</button></div></div>`:"";
  return `<section class="blk kand"><div class="bh"><h3>Mastery-Prüfung</h3><span class="pill navy">Vorschlag des Systems</span></div>
    <div class="mk"><b>${M.skill}</b><span class="muted small">${M.sub}</span></div>
    <ul class="ev">${M.evid.map(e=>`<li>${fmt(e)}</li>`).join("")}</ul>
    <div class="pq"><span class="lab">Prüffrage · anderer Kontext als die geübten Aufgaben</span><p>${M.frage}</p></div>
    <dl class="kv"><dt>Erwartung</dt><dd>${M.erw}</dd><dt>Kriterium</dt><dd>${M.krit}</dd></dl>
    <div class="msteps">${steps}</div>
    <div class="row"><button type="button" class="btn okb" onclick="decide('ok')">${I("checkc","sm")}Gemeistert bestätigen</button><button type="button" class="btn ghost" onclick="S.vopen=true;render()">Vertagen</button></div>${vt}
    ${hint(`Prüffrage, Erwartung und Kriterium hängen am Skill, damit die Prüfung nicht an der Tagesform des Coaches hängt (neu, Pakete A und E). Bestätigen schreibt den Coach-Zustand „gemeistert“ neben den Vorschlag des Systems. Erst dann erscheinen Grün und das Abzeichen beim Kind; die Animation „Coach-Badge“ kommt später. Vertagen braucht einen Grund. Heute hängt Mastery an Microskills statt an <code>skill_key</code>, und Kandidat, Bestätigt und Vertagt gibt es als Zustände nicht (A0).`)}</section>`;
}
function decisionBlk(){
  const p=S.emirPfad;
  if(p)return `<section class="blk"><div class="bh"><h3>Pfad für die Kernarbeit</h3></div>
    <div class="res">${I("path")}<div><b>${p==="tiefer"?"Eine Stufe tiefer: Minus vor der Klammer (Kl. 7)":"Beim Plan: Klammern ausmultiplizieren"}</b><span>entschieden von Sara um ${stepTime()}</span></div></div>
    <div class="row"><button type="button" class="link sm" onclick="S.emirPfad=null;render()">Ändern</button></div></section>`;
  return `<section class="blk dec"><div class="bh"><h3>Entscheidung</h3><span class="pill warn">Vorschlag des Systems</span></div>
    <p><b>Kernarbeit eine Stufe tiefer beginnen?</b> Statt „Klammern ausmultiplizieren“ zuerst „Minus vor der Klammer“ aus Klasse 7.</p>
    <ul class="ev"><li>Warm-up: Minus vor der Klammer 1 von 3</li><li>Gleiches Fehlbild wie am 29.09.: nur das erste Vorzeichen geändert</li><li>Das Schulthema Terme und Gleichungen baut darauf auf</li></ul>
    <div class="row"><button type="button" class="btn" onclick="setPfad('tiefer')">Eine Stufe tiefer</button><button type="button" class="btn ghost" onclick="setPfad('plan')">Beim Plan bleiben</button></div>
    ${hint(`Das System schlägt vor, der Coach entscheidet. Beide Zustände werden getrennt gespeichert. Ohne Entscheidung bleibt der Plan.`)}</section>`;
}
function seqBlk(s){
  return `<section class="blk"><div class="bh"><h3>Erklärsequenz</h3><span class="pill">Kernidee 2 von 3</span></div>
    <ol class="kis">${s.ki.map((x,i)=>`<li class="ki ${x.st}"><span class="kn">${x.st==="ok"?I("check","sm"):i+1}</span><div><b>${x.t}</b><span>${x.n}</span></div></li>`).join("")}</ol>
    <div class="sees"><span class="lab">Jonas sieht gerade · ${s.v}</span><p>${s.sees}</p></div>
    <p class="muted small">${fmt("Nach {runden:2 Runden} ohne Erfolg bei einer Kernidee kommt ein Signal zu dir.")}</p>
    ${hint(`Daten aus der Erklärsequenz (Paket E1): Kernidee, Runde, gezeigte Variante und das Fehlbild der Check-Antwort. Der Coach sieht, was das Kind gerade sieht. Ein bestandener Check ist kein Mastery-Signal.`)}</section>`;
}
function taskBlk(t){
  return `<section class="blk"><div class="bh"><h3>${t.title}</h3></div>
    <div class="kidscreen">${t.text}</div>
    <div class="sol"><span class="lkd">${I("lock","sm")}Musterlösung · nur auf deinem Gerät</span><ol>${t.sol.map(x=>`<li>${x}</li>`).join("")}</ol></div>
    <div class="last"><span class="lab">Letzte Eingabe</span><span>${t.last}</span></div></section>`;
}
function ladderBlk(id,d){
  const rec=d.ladder,logs=S.log.filter(l=>l.id===id);
  const rows=LADDER.map(([n,t,x])=>`<button type="button" class="lr${n===rec?" rec":""}" onclick="logStep('${id}',${n})"><span class="ln">${n}</span><span><b>${t}</b><span>${fmt(x)}</span></span>${n===rec?`<span class="pill navy">passt jetzt</span>`:""}</button>`).join("");
  return `<section class="blk"><div class="bh"><h3>Eingreifen</h3>${rec===0?`<span class="pill">Stufe 0: kein Signal, nichts tun</span>`:""}</div>
    <div class="lad">${rows}</div>
    ${d.fb?`<p class="small"><span class="lab">Fehlbild für Stufe 3 und 4</span>${d.fb} · vorbelegt aus dem letzten Versuch</p>`:""}
    ${logs.length?`<div class="logl"><span class="lab">Notiert</span>${logs.map(l=>`<span>Stufe ${l.n} · ${l.t}</span>`).join("")}</div>`:""}
    ${inQueue(id)&&(QK[id]||QW[id]||{}).p===2?`<div class="row"><button type="button" class="btn ghost sm" onclick="doneSignal('${id}')">${I("check","sm")}Signal erledigt</button></div>`:""}
    ${hint(`Antippen notiert den Eingriff. Stufe 1 und 2 zählen nur, ab Stufe 3 geht der Eingriff mit Fehlbild in die Akte. Stufe 4 setzt den Pfad sofort eine Stufe tiefer.`)}</section>`;
}
function sheetHtml(){
  if(!S.sel||(S.step!=="warmup"&&S.step!=="kern"))return "";
  const id=S.sel,k=KID[id],st=S.step;
  const d=id==="emir"&&st==="kern"&&S.emirPfad==="tiefer"?DET.kernEmirT:DET[st][id];
  const td=tileData(id,st);
  const parts=[];
  if(id==="mila")parts.push(masteryBlk());
  if(id==="emir"&&st==="warmup")parts.push(decisionBlk());
  if(d.info)parts.push(`<section class="blk info"><p>${fmt(d.info)}</p>${d.ack&&!S.done.has(id)?`<div class="row"><button type="button" class="btn sm" onclick="doneSignal('${id}')">Angesprochen</button></div>`:""}</section>`);
  parts.push(zielBlk(id));
  if(d.seq)parts.push(seqBlk(d.seq));

  if(d.att)parts.push(`<section class="blk"><div class="bh"><h3>Falsche Antworten</h3></div><ul class="att">${d.att.map(a=>`<li><span class="pill bad">${a.r}</span><code>${a.a}</code><span class="fb">Fehlbild: ${a.fb}</span></li>`).join("")}</ul></section>`);
  if(d.hints)parts.push(`<section class="blk"><div class="bh"><h3>Genutzte Hinweise</h3></div><ul class="ev">${d.hints.map(h=>`<li>${h}</li>`).join("")}</ul></section>`);
  if(d.task||d.seq)parts.push(ladderBlk(id,d));
  parts.push(`<section class="blk"><div class="bh"><h3>Heute</h3></div><dl class="kv">${d.today.map(([a,b])=>`<dt>${a}</dt><dd>${fmt(b)}</dd>`).join("")}</dl></section>`);
  parts.push(hint(`Musterlösung liegt in <code>task_solutions</code> und ist über <code>task_solution_get</code> für Coaches lesbar (C0). Für Schülerkonten muss der Zugriff ausgeschlossen und belegt sein. Fehlbilder kommen aus der Zuordnung „falsche Antwort → Fehlbild“ an der Aufgabe (Paket E1). Nur Kinder dieser Session, keine Vertrags- oder Elterndaten.`));
  return `<header class="shd"><span class="av">${ini(k.name)}</span><div class="tt"><b>${k.name}</b><span>Platz ${seatOf(id)} · Kl. ${k.kl} · ${fmt(td.ph)}</span></div>
    <button type="button" class="ibtn" aria-label="Schließen" onclick="closeKid()">${I("x")}</button></header>
    <div class="sbody" id="sbody">${parts.join("")}</div>`;
}

/* ================= Check-out ================= */

/* ================= Danach ================= */

  const items=[];

  if(noNote.length)items.push(["note","warn",`Notiz fehlt: ${noNote.join(", ")}`,"Ein Satz pro Kind für das nächste Briefing",`<button type="button" class="btn sm ghost" onclick="setStep('checkout')">Nachtragen</button>`]);
  const m=S.mastery.mila;
  if(!m||!m.res)items.push(["award","",`Mastery-Prüfung offen: Mila`,"Hypotenuse berechnen · der Vorschlag bleibt für die nächste Session",""]);
  else if(m.res==="vertagt")items.push(["award","",`Vertagt: Mila · Hypotenuse berechnen`,m.grund,""]);
  else items.push(["checkc","",`Gemeistert: Mila · Hypotenuse berechnen`,`bestätigt um ${m.t}`,""]);
  if(S.emirPfad==="tiefer")items.push(["path","",`Pfad geändert: Emir eine Stufe tiefer`,"Minus vor der Klammer (Kl. 7) · steht in der Akte",""]);
  bySeat().forEach(k=>{const f=S.flags[k.id]||{};
    if(f.eltern)items.push(["flag","warn",`Elternkontakt: ${first(k.id)}`,"erscheint bei den Admins auf „Heute“",""]);
    if(f.pfad)items.push(["flag","warn",`Pfad passt nicht: ${first(k.id)}`,"geht an die Admins zur Prüfung",""]);});
  const ein=S.log.filter(l=>l.n>=3).length;
  const said=S.said.size;
  const open=items.map(([ic,c,t,s,a])=>`<li class="op"><span class="li ${c}">${I(ic)}</span><div><b>${t}</b><span>${s}</span></div>${a||"<span></span>"}</li>`).join("");
  const mOk=m&&m.res==="ok"?1:0,mV=m&&m.res==="vertagt"?1:0;
  return `<div class="after">
    <section><div class="sh"><h2>Vor dem Abschluss</h2><span>${items.length} Punkte</span></div><ul class="card open">${open}</ul>
      ${hint(`Offene Mastery-Prüfungen gehen nicht verloren: Der Vorschlag des Systems bleibt bestehen und erscheint im nächsten Briefing. Fehlende Notizen blockieren den Abschluss nicht, stehen aber im Briefing als „noch keine Notiz“.`)}</section>
    <aside><div class="sh"><h2>Geht in die Akten</h2></div>
      <section class="card akte"><dl class="kv">
        <dt>Anwesend</dt><dd>5 von 5</dd>
        <dt>Einheit verbraucht</dt><dd>5</dd>
        <dt>Aufgaben bearbeitet</dt><dd>36</dd>
        <dt>Eingriffe ab Stufe 3</dt><dd>${ein}</dd>
        <dt>Mastery bestätigt / vertagt</dt><dd>${mOk} / ${mV}</dd>
        <dt>Erklärsequenzen abgeschlossen</dt><dd>1</dd>
        <dt>Satz gesagt</dt><dd>${said} von 5</dd>
        <dt>Notizen</dt><dd>${5-noNote.length} von 5</dd>
        <dt>Quest-Termine</dt><dd>5 von 5</dd></dl>
        ${S.closed?`<div class="closed">${I("checkc")}Abgeschlossen um 17:35</div>`:`<button type="button" class="btn wide" onclick="closeSession()">Session abschließen</button>`}
      </section>
      ${hint(`Der Abschluss schreibt Anwesenheit (verbraucht die Einheit, <code>einheit_verbraucht</code>), Eingriffe ab Stufe 3, Mastery-Entscheidungen, Notizen und Flags in die Akten. Mit welchen Stellschrauben die Session lief, wird mitgespeichert.`)}
    </aside>
  </div>`;
}

/* ================= Stellschrauben-Liste ================= */
function scPanel(){
  if(!S.sc||!USED.size)return "";
  const rows=[...USED].map(k=>SC[k]).map(d=>`<tr><td>${d.n}</td><td class="num">${d.v}</td><td class="num">${d.r}</td></tr>`).join("");
  return `<section class="card scp"><div class="sh"><h2>Auf dieser Ansicht einstellbar</h2><span>${USED.size} Stellschrauben</span></div>
    <div class="tw"><table><thead><tr><th>Stellschraube</th><th>Startwert</th><th>Spanne</th></tr></thead><tbody>${rows}</tbody></table></div>
    <span class="small">Gold markierte Werte sind Einstellungen mit Startwert. Admins ändern sie ohne Deployment, jede Session speichert, mit welchen Werten sie lief. Antippen zeigt Startwert und Spanne.</span></section>`;
}

/* ================= Rendern ================= */
function renderSteps(){
  document.getElementById("steps").innerHTML=STEPS.map(([k,l])=>`<button type="button" aria-pressed="${S.step===k}" onclick="setStep('${k}')">${l}</button>`).join("");
}
function render(keepFocus){
  document.body.classList.toggle("hints",S.hints);
  document.body.classList.toggle("scmode",S.sc);
  document.getElementById("sw-hints").setAttribute("aria-pressed",String(S.hints));
  document.getElementById("sw-sc").setAttribute("aria-pressed",String(S.sc));
  for(const m in MODES)document.getElementById("m-"+m).setAttribute("aria-pressed",String(S.mode===m));
  renderSteps();
  USED.clear();
  const sheet=document.getElementById("sheet"),sb=document.getElementById("sbody"),keep=sb?sb.scrollTop:0;
  const sh=sheetHtml();
  sheet.innerHTML=sh;sheet.hidden=!sh;document.getElementById("scrim").hidden=!sh;
  if(sh){const nb=document.getElementById("sbody");if(nb)nb.scrollTop=keep;}
  document.getElementById("top").innerHTML=renderTop();
  document.getElementById("tline").innerHTML=renderTimeline();
  const view={vorher:vVorher,checkin:vCheckin,warmup:vLive,kern:vLive,checkout:vCheckout,danach:vDanach}[S.step]();
  document.getElementById("inner").innerHTML=view+scPanel();
  if(keepFocus){const el=document.getElementById(keepFocus);if(el){el.focus();try{const v=el.value;el.setSelectionRange(v.length,v.length);}catch(e){}}}
}

/* ================= Aktionen ================= */
function setStep(s){S.step=s;S.sel=null;render();document.getElementById("body").scrollTop=0;}
function openKid(id){S.sel=id;S.vopen=false;S.vgrund=null;render();const nb=document.getElementById("sbody");if(nb)nb.scrollTop=0;}
function closeKid(){S.sel=null;render();}
function seat(id,i){S.seats[i]=id;toast(`${first(id)} sitzt an Tablet ${i}. Das Tablet zeigt jetzt den Check-in.`);render();}
function unseat(i){S.seats[i]=null;render();}
function arrive(id){S.arrived[id]=true;render();}
function setFall(id,f){S.fall[id]=f;render();}
function togglePick(id){S.pick[id]=!S.pick[id];S.tq[id]=S.tq[id]||"";render(S.pick[id]?"tq-"+id:null);}
function pickThema(id,k){S.thema[id]=k;S.pick[id]=false;S.tq[id]="";toast(`Schulthema für ${first(id)}: ${TH[k].l}. Ziel der Stunde gesetzt.`);render();}
function setPfad(p){S.emirPfad=p;toast(p==="tiefer"?"Entschieden: Emir beginnt die Kernarbeit eine Stufe tiefer.":"Entschieden: Emir bleibt beim Plan.");render();}
function setGrund(i){S.vgrund=MASTERY.gruende[i];render();}
function decide(r){S.mastery.mila={res:r,grund:S.vgrund,t:stepTime()};S.vopen=false;
  toast(r==="ok"?"Gebucht: Hypotenuse berechnen ist gemeistert.":"Vertagt. Der Skill kommt in einer späteren Session wieder.");render();}
function undoM(){delete S.mastery.mila;S.mchk={frage:false,erkl:false};S.vgrund=null;render();}
function logStep(id,n){S.log.push({id,n,t:stepTime()});
  if(n===4&&id==="emir"&&S.step==="kern"){S.emirPfad="tiefer";toast("Stufe 4 notiert. Emir arbeitet jetzt eine Stufe tiefer: Minus vor der Klammer.");}
  else toast(n>=3?`Stufe ${n} notiert, mit Fehlbild für die Akte.`:`Stufe ${n} notiert.`);
  render();}
function doneSignal(id){S.done.add(id);toast(id==="lea"?"Als angesprochen markiert.":"Signal erledigt.");render();}
function nextSay(id){S.sayIdx[id]=(S.sayIdx[id]||0)+1;delete S.say[id];render();}
function toggleSaid(id){S.said.has(id)?S.said.delete(id):S.said.add(id);render();}
function toggleFlag(id,f){S.flags[id]=S.flags[id]||{};S.flags[id][f]=!S.flags[id][f];render();}
function closeSession(){S.closed=true;toast("Abgeschlossen. Anwesenheit, Entscheidungen und Notizen stehen in den Akten.");render();}
function setMode(m){S.mode=m;try{localStorage.setItem("cl-mode",m);}catch(e){}layout();render();}
let TT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(TT);TT=setTimeout(()=>{t.hidden=true;},2800);}

document.addEventListener("click",e=>{
  if(!S.sc)return;const el=e.target.closest(".sc");if(!el)return;
  e.preventDefault();e.stopPropagation();const d=SC[el.dataset.k];
  toast(`Stellschraube · ${d.n}: Startwert ${d.v}, Spanne ${d.r}`);
},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sel)closeKid();});

/* ================= Gerät und Breiten ================= */
function layout(){
  const stage=document.getElementById("stage"),frame=document.getElementById("frame"),dev=document.getElementById("device"),label=document.getElementById("devlabel");
  const dbarH=document.querySelector(".dbar").offsetHeight;
  dev.classList.remove("ipad");
  if(S.mode==="full"){
    stage.classList.add("full");frame.style.width="";frame.style.height="";
    dev.style.width="100%";dev.style.height=Math.max(560,window.innerHeight-dbarH)+"px";dev.style.transform="";label.textContent="";
  }else{
    const [w,h,txt]=MODES[S.mode];stage.classList.remove("full");dev.classList.add("ipad");
    const avail=Math.max(280,stage.clientWidth-32-24),s=Math.min(1,avail/w);
    dev.style.width=w+"px";dev.style.height=h+"px";dev.style.transform=s<1?`scale(${s})`:"";
    frame.style.width=(w*s)+"px";frame.style.height=(h*s)+"px";
    label.textContent=txt+(s<1?` · verkleinert auf ${Math.round(s*100)} %`:"");
  }
  document.getElementById("app").dataset.w=dev.offsetWidth<1000?"narrow":"wide";
}
window.addEventListener("resize",layout);
layout();render();
</script>
