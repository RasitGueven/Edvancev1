<title>Admin-Prüfansicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Schibsted+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400&display=swap">
<style>
/* Layout: Dummy-Leiste oben, darunter ein Geräterahmen. Darin die Admin-App im Stil der Admin-Hülle (H1–H4b):
   Expertenliste mit Menüleiste, Prüfansicht und Editor als Fokusseiten ohne Leiste, Entscheidungs- bzw. Sammelleiste unten.
   Bewusst nur hell wie die Admin-App. Farben aus edvance-app/src/design/tokens.ts. */
:root{
  --mid-1:#43608F; --mid-2:#3E5985; --mid-3:#334B73; --mid-4:#263A5B; --mid-5:#17263F;
  --navy:#334D7A; --navy-hover:#253D6A; --navy-light:#EEF2F8; --navy-line:#D3DCEA;
  --on-cream:#1A2E4A; --gold:#D4A843;
  --cream:#F7F5EE; --cream-80:rgba(247,245,238,.80); --cream-60:rgba(247,245,238,.60);
  --cream-14:rgba(247,245,238,.14); --cream-08:rgba(247,245,238,.08);
  --bg:#F7F7F5; --surface:#FFFFFF; --subtle:#EFEFED; --hover:#FAFAF8; --border:#E8E8E5; --line:#DCDCD8;
  --t1:#1A1A18; --t2:#4A4A47; --t3:#888884; --disabled:#B8B8B4;
  --ok:#2A8A4A; --ok-hover:#237A40; --ok-bg:#EAF5EE; --ok-line:#CDE6D6;
  --warn:#C87E00; --warn-bg:#FEF3E2; --warn-line:#F1D9AE;
  --bad:#B91C1C; --bad-bg:#FEF2F2; --bad-line:#F3C7C7;
  --hint-bg:#FBF6EA; --hint-line:#D4A843; --hint-ink:#7A5610;
  --stage:#E3E6EB; --bezel:#0B111F; --scrim:rgba(11,17,31,.42);
  --sh-xs:0 1px 2px rgba(51,77,122,.06); --sh-sm:0 1px 3px rgba(51,77,122,.07),0 1px 2px rgba(51,77,122,.04);
  --sh-lg:0 16px 40px rgba(51,77,122,.20); --sh-up:0 -4px 16px rgba(51,77,122,.08);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mark:"Space Grotesk","Schibsted Grotesk",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--t1);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
kbd{font:inherit;font-size:11px;font-weight:500;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.6;line-height:1.5}
@media (hover:none){kbd{display:none}}
.num{font-variant-numeric:tabular-nums}

/* Dummy-Leiste */
.dbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-inline:16px;padding-block:10px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:5}
.dbar .tt{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.dbar .tt b{font-family:var(--f-display);font-weight:600;font-size:17px}
.dbar .tt span{font-size:12.5px;color:var(--t3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:none;border-left:1px solid var(--line);background:none;padding:7px 12px;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:none}
.seg button:hover{background:var(--subtle)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--cream);font-weight:600}
.ctl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3)}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;color:var(--t2);cursor:pointer}
.sw .knob{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:left .15s ease-out}
.sw[aria-pressed="true"]{border-color:var(--hint-line);color:var(--hint-ink)}
.sw[aria-pressed="true"] .knob{background:var(--hint-line)}
.sw[aria-pressed="true"] .knob::after{left:14px}
.tlink{border:none;background:none;color:var(--navy);cursor:pointer;font-size:13px;padding:4px 2px}
.tlink:hover{text-decoration:underline}

/* Bühne und Gerät */
.stage{display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:20px 28px}
.stage.full{padding:0}
.frame{position:relative}
.device{position:absolute;top:0;left:0;transform-origin:top left;background:var(--bg);overflow:hidden}
.stage.full .frame{width:100%}
.stage.full .device{position:relative}
.device.laptop{border-radius:12px;box-shadow:0 0 0 1px rgba(11,17,31,.18),var(--sh-lg)}
.device.ipad{border-radius:26px;box-shadow:0 0 0 12px var(--bezel),0 24px 60px rgba(11,17,31,.35)}
.devlabel{font-size:12.5px;color:var(--t3);margin-top:22px;text-align:center}
.stage.full .devlabel{display:none}

/* App-Hülle */
.app{position:relative;display:grid;height:100%;grid-template-columns:minmax(0,1fr)}
.app[data-layout="full"]{grid-template-columns:256px minmax(0,1fr)}
.app[data-layout="rail"]{grid-template-columns:88px minmax(0,1fr)}
.app.focus{grid-template-columns:minmax(0,1fr)!important}
.app.focus .side,.app.focus .mtop{display:none!important}
.side{grid-column:1}
.mainwrap{grid-column:-2/-1;grid-row:1;display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.mtop{display:none;align-items:center;gap:8px;padding-inline:8px;padding-block:6px;background:var(--surface);border-bottom:1px solid var(--border)}
.app[data-layout="narrow"] .mtop{display:flex}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:none;border-radius:var(--r-md);color:var(--t2);cursor:pointer}
.ibtn:hover{background:var(--subtle);color:var(--t1)}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.main{container:main / inline-size;max-width:1400px;margin-inline:auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.app[data-layout="rail"] .main{padding-inline:28px;padding-block:26px 44px}
.app[data-layout="full"] .main{padding-inline:36px;padding-block:30px 48px}
.app.focus .main{padding-inline:20px;padding-block:18px 32px;gap:16px}
.app.focus[data-layout="full"] .main{padding-inline:32px}

.side{display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto;padding:16px 12px;
  background:linear-gradient(to bottom,var(--mid-1),var(--mid-2) 25%,var(--mid-3) 50%,var(--mid-4) 75%,var(--mid-5));color:var(--cream)}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;min-height:48px}
.brand svg{width:34px;height:34px;flex:none}
.brand .wm{font-family:var(--f-mark);font-size:20px;letter-spacing:.045em;line-height:1}
.brand .role{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-60)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.ngrp{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--cream-60);padding:14px 12px 6px}
.ni{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-md);border:none;background:none;color:var(--cream-80);font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.ni:hover{background:var(--cream-08);color:var(--cream)}
.ni[aria-current="page"]{background:var(--cream-14);color:var(--cream);font-weight:600}
.ni[aria-current="page"] .ic{color:var(--gold)}
.ni .short{display:none}
.cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--gold);color:var(--on-cream);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.sfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--cream-14)}
.me{display:flex;align-items:center;gap:10px;padding:8px 12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--cream);color:var(--on-cream);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none}
.me .lbl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.me small{font-size:12px;color:var(--cream-60)}
.app[data-layout="rail"]:not(.side-open) .side{padding:14px 8px}
.app[data-layout="rail"]:not(.side-open) .brand{justify-content:center;padding:4px 0 12px}
.app[data-layout="rail"]:not(.side-open) .brand .wm,.app[data-layout="rail"]:not(.side-open) .brand .role,
.app[data-layout="rail"]:not(.side-open) .me .lbl,.app[data-layout="rail"]:not(.side-open) .ni .long{display:none}
.app[data-layout="rail"]:not(.side-open) .ni{flex-direction:column;justify-content:center;gap:3px;min-height:52px;padding:4px 2px;font-size:11px;text-align:center}
.app[data-layout="rail"]:not(.side-open) .ni .short{display:block;line-height:1.15}
.app[data-layout="rail"]:not(.side-open) .ngrp{font-size:0;padding:0;height:1px;background:var(--cream-14);margin:5px 14px}
.app[data-layout="rail"]:not(.side-open) .cnt{position:absolute;top:4px;right:12px;min-width:18px;height:18px;font-size:10.5px;padding:0 5px}
.app[data-layout="rail"]:not(.side-open) .me{justify-content:center;padding:8px 0}
.app[data-layout="narrow"] .side{position:absolute;top:0;bottom:0;left:0;width:280px;z-index:30;box-shadow:var(--sh-lg);transform:translateX(-105%);transition:transform .2s ease-out}
.app[data-layout="narrow"].side-open .side{transform:none}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}

/* Bausteine */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--navy);background:var(--navy);color:var(--cream);font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s ease-out}
.btn:hover{background:var(--navy-hover)}
.btn.ghost{background:var(--surface);color:var(--t1);border-color:var(--line)}
.btn.ghost:hover{background:var(--subtle)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;padding-inline:26px}
.btn.ok:hover{background:var(--ok-hover)}
.btn.badl{background:var(--surface);color:var(--bad);border-color:var(--bad-line)}
.btn.badl:hover{background:var(--bad-bg)}
.btn:disabled{background:var(--disabled);border-color:var(--disabled);color:#fff;cursor:not-allowed}
.btn.ghost:disabled{background:var(--surface);color:var(--disabled);border-color:var(--border)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.sq{width:44px;padding:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--subtle);color:var(--t2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.navy{background:var(--navy-light);color:var(--navy)}
.pill.line{background:var(--surface);border:1px solid var(--line);color:var(--t3);font-weight:500}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.link{display:inline-flex;align-items:center;gap:6px;min-height:36px;border:none;background:none;padding:0;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}
input[type=text],select,textarea{font-size:14.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;min-height:44px;color:var(--t1)}
textarea{width:100%;resize:vertical;min-height:64px}
.searchf{position:relative;flex:1 1 240px;min-width:0}
.searchf input{width:100%;padding-left:40px}
.searchf .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--t2);cursor:pointer}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--cream);font-weight:600}
.chip.r[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.ph .txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 320px}
.ph h1{font-family:var(--f-display);font-weight:500;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.ph p{margin:0;color:var(--t2);font-size:14.5px;max-width:64ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{display:none;border:1.5px dashed var(--hint-line);background:var(--hint-bg);border-radius:var(--r-md);padding:10px 13px;font-size:13px;line-height:1.55;color:var(--t2)}
.hint b{color:var(--hint-ink);font-weight:600;margin-right:4px}
.hint code{font-size:12px;background:rgba(212,168,67,.16);border-radius:4px;padding:0 4px}
body.hints .hint{display:block}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy-light);color:var(--navy);border-radius:var(--r-md);padding:9px 14px;font-size:14px}
.notice .tlink{margin-left:auto}

/* Expertenliste */
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--hover)}
td{padding:10px 12px;border-bottom:1px solid var(--subtle);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--navy-light)}
tbody tr:last-child td{border-bottom:none}
td.cb,th.cb{width:52px;padding:0 4px 0 8px}
.cbx{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer;border-radius:var(--r-md)}
.cbx:hover{background:var(--subtle)}
.cbx input{width:18px;height:18px;accent-color:var(--navy);cursor:pointer;margin:0}
th .allsel{display:inline-flex;align-items:center;gap:2px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--t2)}
td .two{display:flex;flex-direction:column;line-height:1.35;min-width:0}
td .two b{font-weight:600}
td .two span{font-size:13px;color:var(--t3)}
.pilotdot{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t2)}
.pilotdot i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
@container main (max-width:760px){.opt{display:none}}

/* Dock: Sammelleiste und Entscheidungsleiste */
.dock{position:relative;container:dock / inline-size;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--sh-up);
  padding-inline:16px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10}
.dock .in{max-width:1340px;margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.drow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.dinfo{flex:1 1 260px;min-width:0;font-size:13.5px;color:var(--t2)}
.dinfo b{color:var(--t1)}
.bwarn{color:var(--warn);font-weight:600}
.dbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dk-n{display:none}
@container dock (max-width:700px){.dk-w{display:none!important}.dk-n{display:flex}.dbtns{width:100%}.dbtns .btn{flex:1 1 auto}}
.dpanel{border:1px solid var(--border);background:var(--bg);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dpanel .ph2{font-weight:600}
.dpanel label{font-size:13px;color:var(--t2)}
.dpanel .pacts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.perr{font-size:13px;color:var(--bad)}
.perr:empty{display:none}
.menu{position:absolute;right:16px;bottom:calc(100% + 6px);z-index:25;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:6px;min-width:250px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:none;background:none;border-radius:var(--r-md);text-align:left;cursor:pointer;font-size:14.5px;color:var(--t1)}
.menu button:hover{background:var(--subtle)}
.menu button.bad{color:var(--bad)}
.menu hr{border:none;border-top:1px solid var(--subtle);margin:4px 6px}
.menu .mn{display:none}
@container dock (max-width:700px){.menu .mn{display:flex}.menu hr.mn{display:block}}

/* Dialog */
.dlg{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.dbox{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-lg);padding:22px 24px 20px;display:flex;flex-direction:column;gap:14px}
.dbox h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:23px;line-height:1.2;text-wrap:balance}
.dbox .lead{margin:-6px 0 0;color:var(--t2);font-size:14px}
.sumrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.sumrow div{padding:12px 16px;display:flex;flex-direction:column}
.sumrow div+div{border-left:1px solid var(--border)}
.sumrow small{font-size:12.5px;color:var(--t3);font-weight:500}
.sumrow b{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.sumrow .k b{color:var(--ok)}
.grp{border:1px solid var(--border);border-radius:var(--r-md);background:var(--hover)}
.grp summary{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;cursor:pointer;font-size:14px;list-style:none}
.grp summary::-webkit-details-marker{display:none}
.grp summary::before{content:"›";color:var(--t3);transition:transform .15s}
.grp[open] summary::before{transform:rotate(90deg)}
.grp summary .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.grp ul{margin:0;padding:0 14px 10px 34px;font-size:13.5px;color:var(--t2)}
.grp li{padding:2px 0}
.grps{display:flex;flex-direction:column;gap:6px}
.subh{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin:0}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--t1);border-radius:var(--r-md);padding:10px 14px;font-size:13.5px}
.dfield{display:flex;flex-direction:column;gap:6px}
.dfield label{font-size:13.5px;font-weight:600;color:var(--t2)}
.dfield select,.dfield input{width:100%}
.dacts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.affl{font-size:13.5px;color:var(--t2);margin:0}

/* Prüfansicht */
.pk{padding:14px 18px 0;display:flex;flex-direction:column;gap:10px}
.pkrow{display:flex;gap:10px 16px;align-items:flex-start;flex-wrap:wrap}
.pkt{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:3px}
.pkmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--t3)}
.pk h1{font-family:var(--f-display);font-weight:500;font-size:25px;line-height:1.2;margin:0;text-wrap:balance}
.pksub{font-size:14px;color:var(--t2)}

/* ================= Helfer ================= */
function lenaPill(t){
  if(t.aus)return `<span class="pill line">Nicht bei Lena: ${AUS[t.aus]}</span>`;
  if(t.status==="ready")return `<span class="pill ok">Freigegeben</span>`;
  if(t.status==="beanstandet"&&t.team)return `<span class="pill bad">Vom Team beanstandet</span>`;
  const e=t.lena.e, g=t.aend.length>0;
  if(e==="passt")return `<span class="pill ${g?"navy":"ok"}">Passt${g?" · geändert":""}</span>`;
  if(e==="unsicher")return `<span class="pill warn">Unsicher</span>`;
  if(e==="passt_nicht")return `<span class="pill bad">Passt nicht</span>`;
  return `<span class="pill">Offen</span>`;
}
const statusPill=t=>`<span class="pill ${STATUS[t.status][1]}">${STATUS[t.status][0]}</span>`;
function gefiltert(){
  const q=S.f.q.trim().toLowerCase();
  return TASKS.filter(t=>(S.f.status==="all"||t.status===S.f.status)&&(S.f.thema==="all"||themaOf(t)===S.f.thema)
    &&(!q||(t.kurz+" "+FERT[t.fert][0]).toLowerCase().includes(q)));
}
function filterLabel(){const p=[];if(S.f.status!=="all")p.push(STATUS[S.f.status][0]);if(S.f.thema!=="all")p.push(THEMA[S.f.thema][0]);if(S.f.q)p.push("„"+S.f.q+"“");return p.length?p.join(" · "):"alle Aufgaben";}

      <select id="f-thema" aria-label="Thema" onchange="setF('thema',this.value)"><option value="all">Alle Themen</option>${themen.map(k=>`<option value="${k}"${S.f.thema===k?" selected":""}>${THEMA[k][0]}</option>`).join("")}</select>
      <div class="searchf">${I("search")}<input type="text" id="f-q" placeholder="Aufgabe oder Fertigkeit suchen" value="${esc(S.f.q)}" oninput="setF('q',this.value,true)" aria-label="Suchen"></div>
    </div>
    ${hint(`Auswahlfeld je Zeile, „Alle im Filter“ wählt auch Aufgaben, die nicht sichtbar sind. Ein Filterwechsel hebt die Auswahl auf und sagt das (E 27–29). Probier: Filter „Zur Freigabe“ → „Alle im Filter“ → Freigeben.`)}
    <div class="card tablewrap"><table>
      <thead><tr><th class="cb"><label class="cbx" title="Alle im Filter"><input type="checkbox" id="cb-all" aria-label="Alle im Filter auswählen" ${allSel?"checked":""} onchange="selAll(this.checked)"></label></th>
        <th><span class="allsel">Alle im Filter (${rows.length})</span></th><th>Status</th><th>Lena</th><th class="opt">AFB</th><th class="opt">Pilot</th></tr></thead>
      <tbody>${rows.map((t,i)=>`<tr class="${S.sel.has(t.id)?"sel":""}" onclick="oeffneAusListe(${i})">
        <td class="cb" onclick="event.stopPropagation()"><label class="cbx"><input type="checkbox" id="cb-${t.id}" aria-label="${esc(t.kurz)} auswählen" ${S.sel.has(t.id)?"checked":""} onchange="selOne('${t.id}',this.checked)"></label></td>
        <td><div class="two"><b>${esc(t.kurz)}</b><span>${THEMA[themaOf(t)][0]} · ${FERT[t.fert][0]}</span></div></td>
        <td>${statusPill(t)}</td><td>${lenaPill(t)}</td><td class="opt num">${t.afb}</td>

function dockListe(){

      <button type="button" class="btn ghost dk-w" onclick="sammel('anLena')">Zurück an Lena</button>

function setF(k,v,keep){
  S.f[k]=v;
  if(S.sel.size){S.sel.clear();S.notice="Auswahl aufgehoben, weil der Filter geändert wurde.";}
  S.menu=false;render();
  if(keep){const i=document.getElementById("f-q");i.focus();i.setSelectionRange(i.value.length,i.value.length);}
}
function selAll(on){const r=gefiltert();r.forEach(t=>on?S.sel.add(t.id):S.sel.delete(t.id));S.notice=null;render();}
function selOne(id,on){on?S.sel.add(id):S.sel.delete(id);S.notice=null;render();}

function auslass(akt,t,w){
  const e=t.lena.e;
  switch(akt){
  case "freigeben":
    if(t.status==="ready")return "schon freigegeben";
    if(t.aus==="vera8")return "VERA-8, einzeln freigeben";
    if(t.status==="rueckfrage")return "Rückfrage offen";
    if(t.status==="beanstandet")return t.team?"vom Team beanstandet":"Lena: Passt nicht";
    if(t.status==="draft")return "noch nicht von Lena bewertet";
    if(t.aend.length)return "geändert, einzeln prüfen";
    if(t.befund.length)return "Befund vor der Freigabe: "+t.befund[0].text.split(":")[0].replace(/\.$/,"");
    return null;
  case "anLena":
    if(t.status==="ready")return "freigegeben, erst Freigabe zurücknehmen";
    if(t.aus)return `nicht bei Lena (${AUS[t.aus]})`;
    if(t.status==="draft"&&!e)return "schon offen und unbewertet";
    return null;
  case "pilotAn": if(t.aus)return `nicht bei Lena (${AUS[t.aus]})`; return t.pilot?"schon im Pilot":null;
  case "pilotAus": return t.pilot?null:"nicht im Pilot";
  case "aus": if(t.aus)return `schon nicht bei Lena (${AUS[t.aus]})`; return t.status==="ready"?"freigegeben":null;
  case "ein": if(t.aus==="hand")return null; return t.aus?`nicht von Hand ausgeschlossen (${AUS[t.aus]})`:"ist schon in Lenas Liste";
  case "fert":
    if(t.status==="ready")return "freigegeben, erst Freigabe zurücknehmen";
    if(!w.fert)return null;
    if(t.fert===w.fert)return "hat diese Fertigkeit schon";
    return erlaubt(t).includes(w.fert)?null:"Fertigkeit passt nicht zum Thema der Aufgabe";
  case "afb":
    if(t.status==="ready")return "freigegeben, erst Freigabe zurücknehmen";
    return w.afb&&t.afb===w.afb?"hat diesen Bereich schon":null;
  }
}
let D=null;   // offener Vorschau-Dialog
function sammel(akt){S.menu=false;D={akt,ids:gefiltert().filter(t=>S.sel.has(t.id)).map(t=>t.id),w:{fert:"",afb:"",grund:"",nachricht:""},err:""};renderDlg();}
function vorschau(){
  const bet=[],aus={};
  for(const id of D.ids){const t=byId(id),g=auslass(D.akt,t,D.w);if(g){(aus[g]=aus[g]||[]).push(t);}else bet.push(t);}
  return {bet,aus};
}
function renderDlg(){
  const el=document.getElementById("dlg");if(!D){el.hidden=true;el.innerHTML="";return;}
  const a=AKT[D.akt],{bet,aus}=vorschau(),nAus=D.ids.length-bet.length;
  let felder="";
  if(D.akt==="fert"){
    const opts=[...new Set(D.ids.flatMap(id=>erlaubt(byId(id))))];
    const themen=[...new Set(opts.map(k=>FERT[k][1]))];
    felder=`<div class="dfield"><label for="d-fert">Neue Fertigkeit</label><select id="d-fert" onchange="D.w.fert=this.value;D.err='';renderDlg()"><option value="">Bitte wählen</option>${themen.map(th=>`<optgroup label="${THEMA[th][0]}">${opts.filter(k=>FERT[k][1]===th).map(k=>`<option value="${k}"${D.w.fert===k?" selected":""}>${FERT[k][0]}</option>`).join("")}</optgroup>`).join("")}</select></div>`;
  }
  if(D.akt==="afb")felder=`<div class="dfield"><label>Anforderungsbereich</label><div class="seg" role="group" aria-label="Anforderungsbereich">${["I","II","III"].map(x=>`<button type="button" aria-pressed="${D.w.afb===x}" onclick="D.w.afb='${x}';D.err='';renderDlg()">${x} · ${AFBN[x]}</button>`).join("")}</div></div>`;
  if(D.akt==="fert"||D.akt==="afb")felder+=`<div class="dfield"><label for="d-grund">Kurz warum? <span style="font-weight:400;color:var(--t3)">(optional, steht im Protokoll)</span></label><input type="text" id="d-grund" value="${esc(D.w.grund)}" oninput="D.w.grund=this.value"></div>`;
  if(D.akt==="aus")felder=`<div class="dfield"><label for="d-grund">Grund (Pflicht)</label><input type="text" id="d-grund" placeholder="zum Beispiel: wird für Klasse 9/10 neu geschrieben" value="${esc(D.w.grund)}" oninput="D.w.grund=this.value;D.err=''"></div>`;
  if(D.akt==="anLena")felder=`<div class="dfield"><label for="d-msg">Nachricht an Lena <span style="font-weight:400;color:var(--t3)">(optional, sie sieht sie als „Antwort vom Team“)</span></label><textarea id="d-msg" oninput="D.w.nachricht=this.value">${esc(D.w.nachricht)}</textarea></div>`;
  const brauchtWahl=(D.akt==="fert"&&!D.w.fert)||(D.akt==="afb"&&!D.w.afb);
  const lenaBewertet=(D.akt==="fert"||D.akt==="afb")&&!brauchtWahl?bet.filter(t=>t.status==="review"&&!t.aend.length).length:0;
  const liste=ts=>`<ul>${ts.map(t=>`<li>${esc(t.kurz)} <span style="color:var(--t3)">· ${THEMA[themaOf(t)][0]}</span></li>`).join("")}</ul>`;
  el.innerHTML=`<div class="dbox" role="dialog" aria-modal="true" aria-labelledby="d-h">
    <h2 id="d-h">${a.t(D.ids.length)}</h2><p class="lead">${a.lead}</p>
    ${felder}
    ${brauchtWahl?`<p class="affl">Die Vorschau erscheint, sobald du eine Auswahl getroffen hast.</p>`:`
    <div class="sumrow"><div class="k"><small>Betrifft</small><b>${bet.length}</b></div><div><small>Ausgelassen</small><b>${nAus}</b></div></div>
    ${bet.length?`<details class="grp"><summary>Diese Aufgaben werden geändert<span class="n">${bet.length}</span></summary>${liste(bet)}</details>`:""}
    ${nAus?`<p class="subh">Ausgelassen, mit Grund</p><div class="grps">${Object.entries(aus).map(([g,ts])=>`<details class="grp"><summary>${esc(g)}<span class="n">${ts.length}</span></summary>${liste(ts)}</details>`).join("")}</div>`:""}
    ${lenaBewertet?`<div class="warnbox">${lenaBewertet} davon hat Lena schon unverändert mit „Passt“ bewertet. Sie gelten danach als geändert und müssen einzeln freigegeben werden.</div>`:""}`}
    ${hint(`Vorschau und Ausführung sind derselbe Serveraufruf (<code>nur_vorschau</code>), die Gründe kommen vom Server (F 32, Daten 3). Ab 100 betroffenen Aufgaben kommt ein zweites Bestätigen dazu (Grenzfälle).`)}
    <div class="perr" role="alert">${esc(D.err)}</div>
    <div class="dacts"><button type="button" class="btn ghost" onclick="closeDlg()">Abbrechen</button>
      <button type="button" class="btn" onclick="ausfuehren()" ${brauchtWahl||!bet.length?"disabled":""}>${a.btn(bet.length)}</button></div></div>`;
  el.hidden=false;
}
function closeDlg(){D=null;renderDlg();}
function ausfuehren(){
  if(D.akt==="aus"&&!D.w.grund.trim()){D.err="Bitte einen Grund angeben.";renderDlg();return;}
  const {bet,aus}=vorschau(),ausIds=Object.values(aus).flat().map(t=>t.id),w=D.w,akt=D.akt;
  for(const t of bet){
    if(akt==="freigeben"){t.status="ready";t.freigabe="eben von Rasit";}
    if(akt==="anLena"){t.status="draft";t.lena={e:null,antwort:w.nachricht.trim()||null};t.aend=[];t.team=false;}
    if(akt==="pilotAn")t.pilot=true;
    if(akt==="pilotAus")t.pilot=false;
    if(akt==="aus"){t.aus="hand";t.ausGrund=w.grund.trim();}
    if(akt==="ein"){t.aus=null;t.ausGrund=null;}
    if(akt==="fert"){t.aend.push({feld:"Fertigkeit",vor:FERT[t.fert][0],nach:FERT[w.fert][0],von:"Team",warum:"Sammeländerung"+(w.grund.trim()?": "+w.grund.trim():"")});t.fert=w.fert;}
    if(akt==="afb"){t.aend.push({feld:"Anforderungsbereich",vor:t.afb,nach:w.afb,von:"Team",warum:"Sammeländerung"+(w.grund.trim()?": "+w.grund.trim():"")});t.afb=w.afb;}
  }
  const verb={freigeben:"freigegeben",anLena:"zurück an Lena",pilotAn:"im Pilot",pilotAus:"aus dem Pilot",aus:"aus Lenas Liste genommen",ein:"wieder in Lenas Liste",fert:"geändert",afb:"geändert"}[akt];
  closeDlg();S.sel.clear();render();
  toast(`${bet.length} ${verb}, ${ausIds.length} ausgelassen.`,ausIds.length?["Ausgelassene anzeigen",()=>{S.f={status:"all",thema:"all",q:""};S.sel=new Set(ausIds);S.notice=`Ausgewählt: die ${ausIds.length} ausgelassenen Aufgaben.`;render();}]:null,6000);
}

function dockPruef(){

    <button type="button" onclick="toEditor('')">Im Editor öffnen</button></div>`:"";
  const btns=ready?`<button type="button" class="btn ghost" onclick="toEditor('')">Im Editor öffnen</button>`
    :bean?`<button type="button" class="btn ghost dk-w" onclick="toEditor('')">Im Editor öffnen</button>
      <button type="button" class="btn" onclick="S.panel='anLena';S.menu=false;renderDock()">${anL}</button>`
    :`${t.aus?"":`<button type="button" class="btn ghost dk-w" onclick="S.panel='anLena';S.menu=false;renderDock()">${anL}</button>`}
      <button type="button" class="btn ok" onclick="doFreigeben()" ${gesperrt?"disabled":""}>${I("check","sm")} Freigeben <kbd>↵</kbd></button>`;
  return `${menu}<div class="in">${hint(`Höchstens zwei Knöpfe und „…“, wie die Rückfrage-Karte (C 14–15). Freigeben ist gesperrt, solange „Vor der Freigabe klären“ etwas zeigt. Bei „Passt nicht“ und „Vom Team beanstandet“ gibt es kein Freigeben, nur „Zurück an Lena“ (C 15/17, Entscheidung 3). Nach jeder Entscheidung öffnet sich die nächste Aufgabe der Reihe; die Meldung bietet „Öffnen“ statt „Rückgängig“ (C 21, offene Frage 2).`)}
    ${panel}<div class="drow"><div class="dinfo">${info}</div><div class="dbtns">${btns}
    <button type="button" class="btn ghost sq" aria-label="Weitere Aktionen" aria-expanded="${S.menu}" onclick="S.menu=!S.menu;renderDock()">${I("more")}</button></div></div></div>`;
}
function antwortText(){const a=document.getElementById("p-antwort")||document.getElementById("p-msg");return a?a.value.trim():"";}
function doFreigeben(){
  const t=cur();if(t.befund.length||t.status==="beanstandet"||t.status==="ready")return;
  const a=antwortText();if(t.status==="rueckfrage"&&a)t.lena.antwort=a;
  t.status="ready";t.freigabe="eben von Rasit";t.team=false;
  const id=t.id,pos=S.pos;toast(`Freigegeben: ${t.kurz}`,["Öffnen",()=>{S.page="pruef";S.pos=pos;S.panel=null;render();}]);weiter("freigegeben");
}
function doAnLena(){const t=cur(),a=antwortText();t.status="draft";t.lena={e:null,antwort:a||null};t.aend=[];t.team=false;
  const pos=S.pos;toast(`Zurück an Lena: ${t.kurz}`,["Öffnen",()=>{S.page="pruef";S.pos=pos;S.panel=null;render();}]);weiter("anLena");}
function doZurueck(){
  const g=[...document.querySelectorAll('.dpanel .chip[aria-pressed="true"]')].map(b=>GRUENDE[+b.dataset.g]);
  if(!g.length){document.getElementById("p-err").textContent="Bitte mindestens einen Grund wählen.";return;}
  const t=cur();t.status="beanstandet";t.team=true;t.teamgrund={gruende:g,notiz:document.getElementById("p-was").value.trim()||"–",von:"Rasit",am:"eben"};
  const pos=S.pos;toast(`Zurückgewiesen: ${t.kurz}`,["Öffnen",()=>{S.page="pruef";S.pos=pos;S.panel=null;render();}]);weiter("zurueck");
}
function doZuruecknehmen(){const t=cur();t.status="draft";t.freigabe=null;S.panel=null;render();toast("Freigabe zurückgenommen. Die Aufgabe steht wieder auf Offen.");}

/* ================= Editor (angedeutet) ================= */
const ETABS=[["aufgabe","Aufgabe"],["antwort","Antwort & Lösung"],["einordnung","Einordnung"],["bilder","Bilder"],["stoffanker","Stoffanker"]];
function toEditor(ziel){S.editor={ziel:ziel||"aufgabe",gespeichert:false};S.panel=null;S.menu=false;S.page="editor";render();scrollTop();}
function pEditor(){
  const t=cur(),z=S.editor.ziel;
  const felder={aufgabe:[["Titel",t.kurz],["Aufgabentext","(Markdown/LaTeX wie heute)"],["Aufgabentyp",t.typ==="mc"?"MC":t.typ==="teile"?"MULTI_PART":"NUMERIC"]],
    antwort:[["Akzeptierte Antworten",t.werte.map(w=>w.join(" / ")).join(" | ")||"leer"],["Musterlösung",t.weg||"leer"]],
    einordnung:[["Fertigkeit",FERT[t.fert][0]],["Anforderungsbereich",t.afb]],
    bilder:[["Bilder",t.graph?"Generator koordinatensystem":"keine"]],stoffanker:[["Stoffanker",t.befund.some(b=>b.ziel==="stoffanker")?"":"KLP NRW Mathe 7/8 · Funktionen"]]}[z];
  return `<header class="ph"><div class="txt"><button type="button" class="link" onclick="zurPruef()">${I("left","sm")} Zurück zur Prüfansicht</button>
      <span class="eyebrow">Editor · Expertenmodus</span><h1>${esc(t.kurz)}</h1><p>Hier änderst du, was die Prüfkarte nicht kann: Aufgabentext, Typ, Optionen, Teilaufgaben, Einheit, Bilder, Stoffanker.</p></div></header>
    ${hint(`Angedeutet. Der Editor kam aus der Prüfansicht (<code>?zurueck=pruefen</code>) und springt an den Abschnitt „${ETABS.find(x=>x[0]===z)[1]}“. Nach dem Speichern keine automatische Weiterleitung, damit man mehrere Abschnitte ändern kann (D 24–26).`)}
    ${S.editor.gespeichert?`<div class="saved" role="status">${I("check","sm")} Gespeichert.<button type="button" class="btn sm" onclick="zurPruef()">Zurück zur Prüfansicht</button></div>`:""}
    <div class="etabs" role="tablist">${ETABS.map(([k,l])=>`<button type="button" role="tab" class="etab" aria-selected="${k===z}" onclick="S.editor.ziel='${k}';render()">${l}</button>`).join("")}</div>
    <section class="card eform">${felder.map(([l,v],i)=>`<div class="row"><label for="e-${i}">${l}</label>${l==="Aufgabentext"||l==="Musterlösung"?`<textarea id="e-${i}" rows="3">${esc(v)}</textarea>`:`<input type="text" id="e-${i}" value="${esc(v)}" placeholder="${l==="Stoffanker"?"Lehrplan-Beleg wählen":""}">`}</div>`).join("")}
      <div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" onclick="editorSpeichern()">Speichern</button></div></section>`;
}
function editorSpeichern(){
  const t=cur(),z=S.editor.ziel;
  if(z==="stoffanker")t.befund=t.befund.filter(b=>b.ziel!=="stoffanker");
  if(z==="antwort"&&t.id==="t14"){const v=document.getElementById("e-0").value.trim();if(v&&v!=="leer"){t.werte=[[v]];t.befund=[];}}
  S.editor.gespeichert=true;render();
}
function zurPruef(){S.page="pruef";S.editor=null;render();scrollTop();}

/* ================= Ende der Reihe, Platzhalter ================= */
function pEnde(){
  const e=S.erg;
  return `<section class="card endc"><span class="eyebrow">${esc(S.reihe.herkunft)}</span><h1>Reihe durch</h1>
    <div class="kpis"><div><small>Freigegeben</small><b>${e.freigegeben}</b></div><div><small>Zurück an Lena</small><b>${e.anLena}</b></div><div><small>Zurückgewiesen</small><b>${e.zurueck}</b></div><div><small>Übersprungen</small><b>${e.ueber}</b></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" onclick="schliessen()">Zurück zur Expertenliste</button></div>
    ${hint(`Abschluss der Reihe (C 23). „Übersprungene prüfen“ erscheint in der App, wenn es welche gibt.`)}</section>`;
}
function pSoon(){return `<section class="card soonbox"><h2>Im Dummy nicht ausgebaut</h2><p>Diese Seite gehört zur Admin-Hülle. Für diesen Dummy zählen die Expertenliste und die Prüfansicht.</p><div><button type="button" class="btn" onclick="go('liste')">Zur Expertenliste</button></div></section>`;}

/* ================= Rahmen ================= */
function render(){
  document.body.classList.toggle("hints",S.hints);
  document.getElementById("sw-hints").setAttribute("aria-pressed",String(S.hints));
  for(const m in MODES)document.getElementById("m-"+m).setAttribute("aria-pressed",String(S.mode===m));
  const app=document.getElementById("app"),focus=["pruef","editor","ende"].includes(S.page);
  app.classList.toggle("focus",focus);
  renderSide();
  document.getElementById("main").innerHTML=S.page==="liste"?pListe():S.page==="pruef"?pPruef():S.page==="editor"?pEditor():S.page==="ende"?pEnde():pSoon();
  renderDock();
}
function renderDock(){
  const d=document.getElementById("dock"),h=S.page==="liste"?dockListe():S.page==="pruef"?dockPruef():null;
  d.hidden=!h;d.innerHTML=h||"";
}
function go(id){S.page=id;S.sideOpen=false;applySide();render();scrollTop();}
function scrollTop(){document.getElementById("scroll").scrollTop=0;}
function openSide(){S.sideOpen=true;applySide();}
function closeSide(){S.sideOpen=false;applySide();}
function applySide(){document.getElementById("app").classList.toggle("side-open",S.sideOpen);document.getElementById("scrim").hidden=!(S.sideOpen&&document.getElementById("app").dataset.layout==="narrow");}
function toggleHints(){S.hints=!S.hints;render();}
function setMode(m){S.mode=m;try{localStorage.setItem("ap-mode",m);}catch(e){}layout();render();}
let TT=null;
function toast(msg,action,ms=3200){
  const t=document.getElementById("toast");t.innerHTML="";const s=document.createElement("span");s.textContent=msg;t.appendChild(s);
  t.classList.toggle("plain",!action);
  if(action){const b=document.createElement("button");b.type="button";b.textContent=action[0];b.onclick=()=>{t.hidden=true;action[1]();};t.appendChild(b);}
  t.hidden=false;clearTimeout(TT);TT=setTimeout(()=>{t.hidden=true;},action?Math.max(ms,5000):ms);
}
function layout(){
  const stage=document.getElementById("stage"),frame=document.getElementById("frame"),dev=document.getElementById("device"),label=document.getElementById("devlabel");
  const dbarH=document.querySelector(".dbar").offsetHeight;
  dev.classList.remove("laptop","ipad");
  if(S.mode==="full"){stage.classList.add("full");frame.style.width="";frame.style.height="";dev.style.width="100%";dev.style.height=Math.max(520,window.innerHeight-dbarH)+"px";dev.style.transform="";label.textContent="";}
  else{const [w,h,txt]=MODES[S.mode];stage.classList.remove("full");dev.classList.add(S.mode==="laptop"?"laptop":"ipad");
    const avail=Math.max(280,stage.clientWidth-32-(S.mode==="laptop"?0:24)),s=Math.min(1,avail/w);
    dev.style.width=w+"px";dev.style.height=h+"px";dev.style.transform=s<1?`scale(${s})`:"";frame.style.width=(w*s)+"px";frame.style.height=(h*s)+"px";
    label.textContent=txt+(s<1?` · verkleinert auf ${Math.round(s*100)} %`:"");}
  const w=dev.offsetWidth,app=document.getElementById("app");
  const lay=w<900?"narrow":w<1280?"rail":"full";
  if(app.dataset.layout!==lay){app.dataset.layout=lay;S.sideOpen=false;applySide();}
}
window.addEventListener("resize",()=>layout());
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase(),inField=["input","textarea","select"].includes(tag);
  if(e.key==="Escape"){
    if(D){closeDlg();return;}
    if(inField){e.target.blur();return;}
    if(S.menu){S.menu=false;renderDock();return;}
    if(S.page==="pruef"){if(S.panel){S.panel=null;renderDock();}else schliessen();return;}
    if(S.page==="editor"){zurPruef();return;}
    closeSide();return;
  }
  if(S.page!=="pruef"||inField||D)return;
  if(e.key==="Enter"&&tag!=="button"&&!S.panel){e.preventDefault();doFreigeben();}
  else if(e.key==="ArrowRight"){S.erg.ueber++;weiter();}
  else if(e.key==="ArrowLeft")zurueckPos();
  else if(e.key.toLowerCase()==="e"&&!e.metaKey&&!e.ctrlKey)toEditor("");
});
TASKS=JSON.parse(JSON.stringify(START));
layout();render();
</script>
