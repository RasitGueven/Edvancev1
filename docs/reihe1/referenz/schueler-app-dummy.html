<title>Edvance Schüler-App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400&display=swap">
<style>
/* Layout: dunkle Prüfhülle (Steuerleiste oben, Gerät mittig skaliert, Hinweise rechts bzw. darunter).
   Im Gerät die Welt der Schüler-App: heller Blauverlauf, Lichtkugel Eddie, cremefarbene Arbeitsfläche.
   Bewusst nur dunkel: die Hülle soll das Gerät rahmen, nicht konkurrieren. Farben aus Brand Foundation und Design-System-Skill. */
:root{
  color-scheme:dark;
  /* Hülle */
  --h-bg:#0B1019; --h-panel:#121A26; --h-line:#243145; --h-fg:#DCE3EE; --h-fg2:#98A4B8; --h-acc:#F3C76E;
  /* Welt */
  --sky-top:#4B6894; --sky-mid:#2F4874; --sky-low:#1C2C4C; --sky-deep:#111C33;
  --navy:#102038; --cream:#F8F5EE; --cream-lo:#F1EBDD; --paper:#FFFFFF; --rule:#E5DDCC;
  --ink:#102038; --ink-2:#3B4760; --ink-3:#69728A;
  --gold:#DA9721; --gold-hi:#F3C76E; --gold-text:#7C4F06; --xp:#D4A843; --xp-hi:#E8D5A3;
  --on:#F8F5EE; --on-2:rgba(248,245,238,.76); --on-3:rgba(248,245,238,.5);
  --glass:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.22);
  --ok:#27AE60; --ok-bg:#EDFAF3; --ok-ink:#1E7A45; --no:#E88080; --no-bg:#FDF0F0; --no-ink:#9A3535;
  --sicher:#3AAF6A; --unsicher:#F39C12; --offen:#D4D4D0; --mastery:#2A8A4A;
  --streak:#E8A020; --home:#7EEEFF;
  --sh-card:0 30px 80px rgba(3,8,22,.42),0 8px 24px rgba(3,8,22,.22);
  --f-display:"Literata","Iowan Old Style",Georgia,serif;
  --f-ui:"Schibsted Grotesk",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mark:"Space Grotesk","Schibsted Grotesk",sans-serif;
  --e-out:cubic-bezier(.16,1,.3,1); --e-bounce:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--h-bg);color:var(--h-fg);font-family:var(--f-ui);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--h-acc);outline-offset:2px}

/* ---------- Hülle ---------- */
.wrap{display:flex;flex-direction:column;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-mark);font-weight:400;font-size:19px;letter-spacing:.04em;color:var(--h-fg)}
.brand span{font-size:12.5px;color:var(--h-fg2)}
.seg{display:inline-flex;border:1px solid var(--h-line);border-radius:10px;overflow:hidden;background:var(--h-panel)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;color:var(--h-fg2);min-height:34px;border-left:1px solid var(--h-line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:#24324A;color:var(--h-fg);font-weight:600}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.nav{display:inline-flex;gap:6px}
.nb{border:1px solid var(--h-line);background:var(--h-panel);border-radius:10px;min-height:34px;padding:0 12px;font-size:13px;color:var(--h-fg)}
.nb:hover{border-color:#3A4C68}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--h-line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--h-fg2);white-space:nowrap}
.chip[aria-current="true"]{background:var(--h-acc);border-color:var(--h-acc);color:#2A1B02;font-weight:600}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-right:5px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;flex:1;min-height:0}
.stage{min-width:0;display:flex;align-items:flex-start;justify-content:center}
.scaler{position:relative;flex:none}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;padding:12px;border-radius:44px;background:linear-gradient(160deg,#2A303B,#11151C 55%,#1C212A);box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(255,255,255,.07)}
.frame.phone{border-radius:58px}
.notes{min-width:0;background:var(--h-panel);border:1px solid var(--h-line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;align-self:start}
.notes h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.25;color:var(--h-fg)}
.notes .ey{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--h-acc)}
.notes p,.notes li{margin:0;font-size:13.5px;line-height:1.55;color:var(--h-fg2)}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.notes b{color:var(--h-fg);font-weight:600}
.notes .rule{border-top:1px solid var(--h-line);padding-top:10px;font-size:12.5px;color:var(--h-fg2)}
.notes code{font-size:12px;background:#1B2636;border-radius:4px;padding:0 4px;color:var(--h-fg)}
.wrap.nohints .notes{display:none}
.wrap.nohints .main{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}

/* ---------- Gerät ---------- */
#device{position:relative;overflow:hidden;border-radius:32px;color:var(--on);user-select:none;-webkit-user-select:none}
.phone #device{border-radius:46px}
.world{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 36%,var(--sky-low) 72%,var(--sky-deep) 100%)}
.fog{position:absolute;border-radius:50%;pointer-events:none}
.fog.f1{width:95%;height:75%;left:-25%;top:-18%;background:radial-gradient(closest-side,rgba(170,198,240,.22),rgba(170,198,240,0))}
.fog.f2{width:85%;height:65%;right:-28%;top:14%;background:radial-gradient(closest-side,rgba(132,160,214,.2),rgba(132,160,214,0))}
.fog.f3{width:130%;height:58%;left:-15%;bottom:-30%;background:radial-gradient(closest-side,rgba(246,196,110,.18),rgba(246,196,110,0))}
.stars{position:absolute;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;animation:fadeIn 420ms var(--e-out)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[data-in]{animation:rise 620ms var(--e-out) both;animation-delay:calc(var(--d,0) * 1ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.t-hero{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:1.05;margin:0;letter-spacing:-.015em}
.t-lg{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.2;margin:0;text-wrap:balance}
.t-md{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.t-sub{font-size:17px;line-height:1.5;color:var(--on-2);margin:0;text-wrap:balance}
.ey{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--on-3)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px}

/* Licht (Eddie) */
.lux{position:absolute;inset:0;pointer-events:none}
.lx-in{position:absolute;inset:0;animation:luxB 6s ease-in-out infinite}
.lx-in>span{position:absolute;border-radius:50%}
.lx-aura{inset:-95%;background:radial-gradient(closest-side,rgba(246,170,64,.24),rgba(236,154,50,.09) 38%,rgba(226,144,42,.02) 74%,rgba(226,144,42,0))}
.lx-glow{inset:-36%;background:radial-gradient(closest-side,rgba(255,220,154,.5),rgba(252,202,120,.3) 64%,rgba(240,172,74,0))}
.lx-body{inset:0;background:radial-gradient(circle closest-side,#FFFBF1 0%,#FEE9BA 27%,#F7CD83 51%,#ECB35B 72%,#E1A045 88%,rgba(218,151,33,0) 100%)}
.lx-core{left:16%;top:16%;width:68%;height:68%;background:radial-gradient(closest-side,#FFF 0%,rgba(255,252,238,.72) 40%,rgba(255,242,210,0))}
@keyframes luxB{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.orb{position:relative;display:inline-block;border-radius:50%}
.eddie{position:absolute;left:30px;bottom:24px;width:66px;height:66px;border:0;background:none;padding:0;display:grid;place-items:center;z-index:20}
.eddie .orb{width:44px;height:44px;animation:float 6.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ed-pill{position:absolute;left:104px;bottom:30px;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:rgba(14,26,48,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 .5px var(--glass-line);z-index:20}
.pillbtn{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:600;font-size:15px}
.pillbtn.ghost{background:transparent;color:var(--on);box-shadow:inset 0 0 0 1px var(--glass-line)}

/* Buttons in der Welt */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 28px;border:0;border-radius:999px;font-weight:600;font-size:17px;transition:transform 120ms var(--e-out)}
.btn:active{transform:scale(.965)}
.btn-p{background:var(--cream);color:var(--ink);box-shadow:0 8px 24px rgba(4,10,24,.32)}
.btn-g{background:transparent;color:var(--on);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.btn-dark{background:var(--navy);color:var(--cream)}
.btn[disabled]{opacity:.45;cursor:default}
.next{position:absolute;right:30px;bottom:30px;z-index:20}

/* Vor Ort: Kopf mit Phasen */
.otop{position:absolute;left:30px;right:30px;top:22px;display:flex;align-items:center;gap:16px;z-index:10}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .av{width:38px;height:38px;border-radius:50%;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--glass-line);display:grid;place-items:center;flex:none;overflow:hidden}
.who b{font-weight:600;font-size:15px;display:block}
.who small{font-size:12.5px;color:var(--on-3);display:block}
.phases{margin-left:auto;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(14,26,48,.4);box-shadow:inset 0 0 0 .5px var(--glass-line)}
.ph{font-size:12.5px;padding:6px 11px;border-radius:999px;color:var(--on-3);white-space:nowrap}
.phases .ph{display:block;flex:none;white-space:nowrap}
.ph.done{color:var(--on-2)}
.ph.done::before{content:"✓ ";color:var(--gold-hi)}
.ph.now{background:var(--cream);color:var(--ink);font-weight:600}

/* Arbeitsfläche */
.card{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:1000px;height:600px;background:var(--cream);color:var(--ink);border-radius:28px;box-shadow:var(--sh-card);padding:34px 42px;display:flex;flex-direction:column;gap:18px}
.card .ey{color:var(--ink-3)}
.prompt{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.3;margin:0;color:var(--ink);text-wrap:balance}
.math{font-family:var(--f-display);font-weight:600;font-size:40px;color:var(--ink);margin:0}
.sub{font-size:16px;color:var(--ink-2);margin:0;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:66px;border-radius:16px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:24px;display:flex;align-items:center;gap:14px;padding:0 20px;text-align:left;transition:border-color 160ms,background 160ms}
.opt i{font-style:normal;font-family:var(--f-ui);font-size:13px;font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--cream-lo);color:var(--ink-3);flex:none}
.opt:hover{border-color:#C7B995}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right i{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong i{background:var(--no);color:#fff}
.fb{border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.5}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}
.fb.no{background:var(--no-bg);color:var(--no-ink)}
.fb small{display:block;font-size:13.5px;opacity:.85;margin-top:3px}
.hintbox{border-radius:14px;padding:12px 16px;background:#FFF6E2;color:var(--gold-text);font-size:15.5px;line-height:1.5;display:flex;gap:12px;align-items:flex-start}
.hintbox .orb{width:22px;height:22px;flex:none;margin-top:2px}
.hintbox b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.spacer{flex:1}

/* Video */
.vidwrap{display:grid;grid-template-columns:1fr;gap:16px;flex:1;min-height:0;align-content:start}
.vidwrap:not(.shrunk) .vid{max-width:660px;width:100%;margin:0 auto}
.vidwrap.shrunk{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.vid{min-width:0;display:flex;flex-direction:column;gap:10px}
.screen{position:relative;border-radius:16px;overflow:hidden;background:#17263F;aspect-ratio:16/9;max-width:100%}
.screen svg{display:block;width:100%;height:100%}
.flash{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--gold-hi);color:#2A1B02;font-size:13px;font-weight:600;border-radius:999px;padding:5px 13px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.subt{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:88%;background:rgba(10,16,28,.72);color:#fff;font-size:15px;line-height:1.4;padding:6px 12px;border-radius:8px;text-align:center}
.ctl{display:flex;align-items:center;gap:10px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:var(--cream);display:grid;place-items:center;flex:none}
.ctl .time{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ctl .sp{flex:1}
.tog{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.tog[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.chap{display:flex;gap:3px}
.cp{position:relative;flex:1;height:30px;border:0;border-radius:6px;background:var(--cream-lo);padding:0;overflow:hidden;min-width:0}
.cp .fill{position:absolute;inset:0 auto 0 0;background:#D9CDB2}
.cp.on{background:#E9DFC9}
.cp .lb{position:relative;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;padding:0 4px}
.beatname{font-size:14px;color:var(--ink-2);min-height:20px}
.beatname b{color:var(--ink)}
.check{min-width:0;display:flex;flex-direction:column;gap:14px;animation:rise 500ms var(--e-out)}
.check .opts{grid-template-columns:1fr 1fr}
.check .opt{min-height:60px;font-size:22px}

/* Beispiel */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);animation:rise 450ms var(--e-out)}
.step .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--cream-lo);font-size:13px;font-weight:700;color:var(--ink-3);flex:none}
.step .f{font-family:var(--f-display);font-weight:600;font-size:24px}
.step .w{margin-left:auto;font-size:14px;color:var(--ink-3)}
.step.why{border-color:var(--gold);background:#FFFBF0}
.bricks{display:flex;flex-wrap:wrap;gap:10px}
.brick{border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:15.5px;text-align:left;color:var(--ink);max-width:100%}
.brick.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.brick.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no-ink)}

/* Eingabe a√b */
.rootin{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:44px;color:var(--ink)}
.fld{min-width:84px;height:72px;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-family:var(--f-display);font-size:38px;font-weight:600;color:var(--ink);display:grid;place-items:center;padding:0 12px}
.fld.act{border-color:var(--ink);box-shadow:0 0 0 4px rgba(16,32,56,.08)}
.fld.ph{color:#C9BFA8}
.rad{display:flex;align-items:center}
.rad span{border-top:3px solid var(--ink);padding-top:4px;margin-left:-2px}
.pad{display:grid;grid-template-columns:repeat(4,64px);gap:8px}
.pad button{height:56px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);font-size:22px;font-weight:600;color:var(--ink)}
.pad button.w{font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:start}

/* Fehler finden */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);text-align:left;color:var(--ink)}
.line .n{font-size:13px;color:var(--ink-3);width:54px;flex:none}
.line .f{font-family:var(--f-display);font-weight:600;font-size:24px}
.line.sel{border-color:var(--no);background:var(--no-bg)}
.line.okl{border-color:var(--ok);background:var(--ok-bg)}

/* Recap */
.stmts{display:flex;flex-direction:column;gap:12px}
.stmt{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:16px;background:var(--paper);border:1px solid var(--rule)}
.stmt .f{font-family:var(--f-display);font-weight:600;font-size:22px;flex:1}
.wf{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.wf button{border:0;background:none;padding:8px 16px;font-size:14.5px;color:var(--ink-2)}
.wf button[aria-pressed="true"]{background:var(--navy);color:var(--cream);font-weight:600}
.stmt.ok{border-color:var(--ok);background:var(--ok-bg)}
.stmt.no{border-color:var(--no);background:var(--no-bg)}

/* Check-out */
.co{position:absolute;inset:0;display:grid;align-items:start;grid-template-columns:1.1fr 1fr;gap:22px;padding:84px 40px 100px}
.glasscard{background:var(--glass);border-radius:22px;box-shadow:inset 0 0 0 .5px var(--glass-line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.xpbar{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--xp),var(--xp-hi));width:var(--w,40%);transition:width 800ms var(--e-bounce)}
.xprow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--on-2)}
.xprow b{font-family:var(--f-display);font-size:26px;color:var(--xp);font-weight:600}
.sk{display:flex;align-items:center;gap:12px;font-size:15.5px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.s{background:var(--sicher)}.dot.u{background:var(--unsicher)}.dot.o{background:transparent;box-shadow:inset 0 0 0 2px var(--offen)}
.sk>span:not(.dot){flex:1}
.sk small{font-size:13px;color:var(--on-3)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:52px;height:52px;border-radius:14px;border:0;background:var(--glass-2);color:var(--on);font-weight:600;box-shadow:inset 0 0 0 .5px var(--glass-line)}
.day[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.day:disabled{opacity:.35;cursor:default}
.coachline{display:flex;gap:12px;align-items:flex-start;font-family:var(--f-display);font-size:19px;line-height:1.4}
.coachline .av{width:40px;height:40px;border-radius:50%;background:var(--cream);color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}

/* ---------- Zuhause ---------- */

function beatSVG(k,p){
  const g="#2A6B40",g2="#3E9A5B",g3="#4CAF6A",ink="#FFFFFF",hi="#F0DFAE",soft="rgba(255,255,255,.7)";
  const T=(s,x,y,fs,c,a="middle",f="Literata",w=600)=>`<text x="${x}" y="${y}" font-family="${f},Georgia,serif" font-size="${fs}" font-weight="${w}" fill="${c}" text-anchor="${a}">${s}</text>`;
  let s=`<rect width="640" height="360" fill="${g}"/><rect width="640" height="360" fill="url(#vg)"/><defs><linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A6B40"/><stop offset="1" stop-color="#174A2A"/></linearGradient></defs>`;
  const a=P.playing?Math.min(1,p*2.5):1;
  const field=(x,y,n,cs,lab,hl)=>{let r=`<rect x="${x-6}" y="${y-6}" width="${n*cs+12}" height="${n*cs+12}" fill="none" stroke="#fff" stroke-width="2" rx="2"/>`;
    for(let i=0;i<n*n;i++){const rr=Math.floor(i/n),cc=i%n;r+=`<rect x="${x+cc*cs+1}" y="${y+rr*cs+1}" width="${cs-2}" height="${cs-2}" rx="2" fill="${hl&&rr===n-1?hi:(rr%2?g2:g3)}"/>`}
    if(lab)r+=T(lab,x+n*cs/2,y+n*cs+34,22,hi);return r};
  if(k===0){s+=`<g opacity="${a}">${T("√72",320,170,72,ink)}${T("Teilweise die Wurzel ziehen",320,214,18,soft,"middle","Schibsted Grotesk",500)}</g>`}
  if(k===1){s+=`<g opacity="${a}">${T("8² = 64",200,150,34,soft)}${T("√72",320,190,56,hi)}${T("9² = 81",440,150,34,soft)}${T("liegt zwischen 8 und 9",320,240,18,soft,"middle","Schibsted Grotesk",500)}</g>`}
  if(k===2){const shown=Math.max(1,Math.ceil(p*72));let r="";let c=0;
    [[110,70],[350,70]].forEach(([x,y])=>{r+=`<rect x="${x-6}" y="${y-6}" width="${6*30+12}" height="${6*30+12}" fill="none" stroke="#fff" stroke-width="2"/>`;for(let i=0;i<36;i++){if(c++>=shown)break;const rr=Math.floor(i/6),cc=i%6;r+=`<rect x="${x+cc*30+1}" y="${y+rr*30+1}" width="28" height="28" rx="2" fill="${rr%2?g2:g3}"/>`}});
    s+=r+T("72 = 36 · 2",320,320,26,hi)}
  if(k===3){s+=field(210,60,6,32,"Seite: 6",true)+`<g opacity="${a}">${T("√36 = 6",470,170,40,hi)}</g>`}
  if(k===4){s+=`<g opacity="${a}">${T("√(36 · 2)",320,140,44,ink)}${T("= √36 · √2",320,210,44,hi)}</g>`}
  if(k===5){s+=`<g opacity="${a}">${T("√72 = 6 · √2",320,160,46,ink)}${T("= 6√2",320,232,58,hi)}</g>`}
  if(k===6){s+=`<g opacity="${a}"><rect x="90" y="96" width="460" height="168" rx="16" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.3)"/>${T("Merksatz",320,138,16,soft,"middle","Schibsted Grotesk",600)}${T("Größte Quadratzahl suchen,",320,182,26,ink)}${T("Wurzel ziehen, Rest bleibt drin.",320,222,26,hi)}</g>`}
  return s;
}

function vidMount(){
  const el=id=>document.getElementById(id);
  if(!el("vsvg"))return;
  el("vplay").onclick=()=>{if(!P.playing&&P.beat===BEATS.length-1&&P.t>=1){P.beat=0;P.t=0}P.playing=!P.playing;P.last=performance.now();vidDraw()};
  el("vsubt").onclick=e=>{P.sub=!P.sub;e.currentTarget.setAttribute("aria-pressed",P.sub);vidDraw()};
  document.querySelectorAll("#vchap .cp").forEach(b=>b.onclick=()=>{P.beat=+b.dataset.b;P.t=0;P.playing=true;P.last=performance.now();vidDraw()});
  vidDraw();
}
function vidDraw(){
  const svg=document.getElementById("vsvg");if(!svg)return;
  svg.innerHTML=beatSVG(P.beat,P.t);
  const sub=document.getElementById("vsub");sub.textContent=BEATS[P.beat].tx;sub.hidden=!P.sub;
  const total=BEATS.length*BEAT_S,now=P.beat*BEAT_S+P.t*BEAT_S,f=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  document.getElementById("vtime").textContent=`${f(now)} / ${f(total)}`;
  document.getElementById("vbn").innerHTML=`<b>${BEATS[P.beat].id}</b> · ${BEATS[P.beat].t}`;
  document.getElementById("vplay").innerHTML=ic(P.playing?"pause":"play");
  document.querySelectorAll("#vchap .cp").forEach((c,i)=>{c.classList.toggle("on",i===P.beat);c.querySelector(".fill").style.width=(i<P.beat?100:i===P.beat?P.t*100:0)+"%"});
  const fl=document.getElementById("vflash");fl.hidden=!P.flash;fl.textContent=P.flash;
}
function vidLoop(now){
  const dt=Math.min(.1,(now-P.last)/1000);P.last=now;
  if(P.playing&&document.getElementById("vsvg")){
    P.t+=dt/BEAT_S;
    if(P.t>=1){if(P.beat<BEATS.length-1){P.beat++;P.t=0}else{P.t=1;P.playing=false;if(P.mode==="ort")openCheck()}}
    vidDraw();
  }
  if(P.flashT>0){P.flashT-=dt;if(P.flashT<=0){P.flash="";vidDraw()}}
  requestAnimationFrame(vidLoop);
}
function openCheck(){P.shrunk=true;P.pick=null;render()}

function eddie(open){
  return `<button type="button" class="eddie" id="eddie" aria-label="Eddie fragen" aria-expanded="${!!open}">${orb()}</button>
  ${open?`<div class="ed-pill"><button type="button" class="pillbtn" id="hintbtn">${O.hint<3?"Tipp bekommen":"Coach rufen"}</button><button type="button" class="pillbtn ghost" id="idk">Ich weiß es nicht</button></div>`:""}`;
}
const nextBtn=(lbl="Weiter",dis=false)=>`<button type="button" class="btn btn-p next" id="onext"${dis?" disabled":""}>${lbl}</button>`;
const O={warm:null,hint:0,edOpen:false,a:"",b:"",fld:"a",uebFb:null,stepN:1,why:null,line:null,brick:null,rec:{},recDone:false,days:new Set(["Do"]),toast:"",xp:false};
function hints(){
  const H=["Welche Quadratzahl steckt in 50?","Probier 25: 50 = 25 · 2.","Die Wurzel aus 25 ist 5. Was bleibt unter der Wurzel?"];
  return O.hint?`<div class="hintbox">${orb()}<div><b>Tipp ${O.hint} von 3</b>${H.slice(0,O.hint).map((h,i)=>`<div${i<O.hint-1?' style="opacity:.6"':""}>${h}</div>`).join("")}</div></div>`:"";
}

/* ---------- Vor Ort ---------- */

{id:"o-warmup",ctx:"ort",name:"Warm-up",render:()=>{

  return `${otop(0)}<section class="card"><span class="ey">Warm-up · Aufgabe 2 von 3</span>
   <p class="prompt">Welche ist die größte Quadratzahl, die 72 teilt?</p>

   ${O.warm!=null?(O.warm===right?`<div class="fb ok">Genau. 72 = 36 · 2, und 36 = 6 · 6.</div>`:`<div class="fb no">${O.warm===3?"72 ist keine Quadratzahl.":"Das ist eine Quadratzahl, die 72 teilt. Gibt es eine größere?"}<small>Versuch es noch einmal.</small></div>`):""}
   <div class="spacer"></div></section>${eddie(O.edOpen)}${nextBtn("Weiter",O.warm!==right)}`},
 note:{t:"Warm-up: Abruf, was sitzen müsste",p:["3–4 kurze Aufgaben aus Voraussetzungen des Ziels, eine Stufe leichter.","Falsche Antwort: Rückmeldung zum Denkfehler, zweiter Versuch. Zwei Fehlversuche auf derselben Voraussetzung → Signal an den Coach „eine Stufe tiefer?“."],r:"Konzept Session §3, A2 E."}},
{id:"o-video",ctx:"ort",name:"Erklärvideo",render:()=>{

    <div class="opts">${c.opts.map((o,i)=>`<button type="button" class="opt ${P.pick===i?(o.ok?"right":"wrong"):""}" data-mc="${i}"><i>${"ABCD"[i]}</i>${o.a}</button>`).join("")}</div>
    ${P.pick!=null?`<div class="fb ${c.opts[P.pick].ok?"ok":"no"}">${c.opts[P.pick].fb}${c.opts[P.pick].ok?"":`<small>Gleich springt das Video zu ${BEATS[c.opts[P.pick].beat].id} · ${BEATS[c.opts[P.pick].beat].t}.</small>`}</div>`:""}

 note:{t:"Erklärvideo mit Mini-Check und Rücksprung",p:["Spiel das Video ab oder tippe auf ein Kapitel. Am Ende schrumpft das Video nach links, rechts erscheint der Mini-Check (Variante B vom 06.10.).","Falsche Antwort: Rückmeldung zum Denkfehler, dann springt das Video auf den passenden Beat und spielt weiter. Danach kommt dieselbe Frage mit anderen Zahlen (√20).","In der App ist das ein MP4 mit kapitel.json aus dem Studio, kein Remotion Player."],r:"Anforderung Studio §9, E1 erklaer_check_abgeben mit neuer Antwortart ruecksprung. Kopfhörer je Platz."}},
{id:"o-beispiel",ctx:"ort",name:"Lösungsbeispiel",render:()=>{
  const S=[["√72","Die Aufgabe"],["= √(36 · 2)","Größte Quadratzahl, die drinsteckt"],["= √36 · √2","Produktregel"],["= 6√2","Wurzel aus 36 ziehen"]];
  const B=[["Weil 36 die größte Quadratzahl in 72 ist. Mit 4 müsste man weiter vereinfachen.",true],["Weil 36 die Hälfte von 72 ist.",false],["Weil man immer durch 36 teilt.",false]];
  return `${otop(2)}<section class="card"><span class="ey">Geführt · Lösungsbeispiel</span>
  <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="steps">${S.slice(0,O.stepN).map((s,i)=>`<div class="step ${i===1&&O.stepN>=2?"why":""}"><span class="k">${i+1}</span><span class="f">${s[0]}</span><span class="w">${s[1]}</span></div>`).join("")}
   ${O.stepN<4?`<button type="button" class="btn btn-dark" id="reveal" style="align-self:flex-start">Nächsten Schritt aufdecken</button>`:""}</div>
   <div class="qbody">${O.stepN>=2?`<span class="ey">Warum ist Schritt 2 richtig?</span><div class="bricks" style="flex-direction:column">${B.map((b,i)=>`<button type="button" class="brick ${O.why===i?(b[1]?"right":"wrong"):""}" data-why="${i}">${b[0]}</button>`).join("")}</div>
   ${O.why!=null?`<div class="fb ${B[O.why][1]?"ok":"no"}">${B[O.why][1]?"Genau. Jetzt kommt eine ähnliche Aufgabe.":"Schau noch mal auf Schritt 2: Welche Zahl steckt als Quadrat drin?"}</div>`:""}`:`<p class="sub">Deck Schritt für Schritt auf. Bei einem Schritt fragt dich die App, warum er stimmt.</p>`}</div></div>
  <div class="spacer"></div></section>${eddie(false)}${nextBtn("Ähnliche Aufgabe",!(O.why===0))}`},
 note:{t:"Geführt: Lösungsbeispiel mit Selbsterklärung",p:["Schritte aufdecken, bei einem Schritt „Warum?“ mit drei Begründungsbausteinen.","Ein gezeigtes Beispiel bekommt das Kind nie als Aufgabe. Danach folgt eine ähnliche Aufgabe mit Hinweisstufen."],r:"Konzept Session §3, A2 F. Neues Format: Begründungsbausteine."}},
{id:"o-ueben",ctx:"ort",name:"Üben",render:()=>`
  ${otop(3)}<section class="card"><span class="ey">Üben · Schwierigkeit 2</span>
  <p class="prompt">Zieh die Wurzel teilweise.</p>
  <div class="cols"><div class="qbody" style="gap:18px">
   <div class="rootin"><span>√50 =</span><button type="button" class="fld ${O.fld==="a"?"act":""} ${O.a?"":"ph"}" data-fld="a" aria-label="Zahl vor der Wurzel">${O.a||"a"}</button><span class="rad">√<span><button type="button" class="fld ${O.fld==="b"?"act":""} ${O.b?"":"ph"}" data-fld="b" aria-label="Zahl unter der Wurzel">${O.b||"b"}</button></span></span></div>
   ${O.uebFb?`<div class="fb ${O.uebFb[0]}">${O.uebFb[1]}</div>`:""}${hints()}</div>
   <div class="pad">${["7","8","9","⌫","4","5","6","Feld","1","2","3","Prüfen","0"].map(k=>`<button type="button" data-key="${k}" class="${k.length>1?"w":""}"${k==="Prüfen"?' style="grid-column:span 2;background:var(--navy);color:var(--cream)"':""}>${k}</button>`).join("")}</div></div>
  <div class="spacer"></div></section>${eddie(O.edOpen)}${nextBtn("Weiter",!(O.uebFb&&O.uebFb[0]==="ok"))}`,
 note:{t:"Üben mit Hinweisstufen",p:["Eingabe a√b als zwei Felder. Probier 25 und 2, 1 und 50 oder 5 und 2: Jede falsche Antwort bekommt die Rückmeldung ihres Fehlbilds.","Tippe auf Eddie: Tipp 1 ist eine Frage, Tipp 2 eine Strategie, Tipp 3 der erste Schritt, nie die Lösung. Nach Tipp 3 bekommt der Coach ein Signal.","Mit Tipp gelöst zählt nicht als Beleg. Die Schwierigkeit regelt sich über die Zielquote."],r:"A2 G und H. Format a√b: neu, oder als Mehrteiler mit zwei Zahlfeldern."}},
{id:"o-transfer",ctx:"ort",name:"Transfer",render:()=>{
  const L=[["Zeile 1","√75 = √(25 · 3)"],["Zeile 2","= √25 + √3"],["Zeile 3","= 5 + √3"]];
  const B=[["Aus √(25 · 3) wird √25 · √3, also ein Mal statt Plus.",true],["Man darf die Wurzel nur aus der größeren Zahl ziehen.",false],["Die 3 hätte man auch quadrieren müssen.",false]];
  return `${otop(4)}<section class="card"><span class="ey">Transfer · Fehler finden</span>
  <p class="prompt">Ben hat √75 vereinfacht. In welcher Zeile steckt der Fehler?</p>
  <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="lines">${L.map((l,i)=>`<button type="button" class="line ${O.line===i?(i===1?"okl":"sel"):""}" data-line="${i}"><span class="n">${l[0]}</span><span class="f">${l[1]}</span></button>`).join("")}
   ${O.line!=null&&O.line!==1?`<div class="fb no">Diese Zeile stimmt. Schau dir an, was aus dem Mal wird.</div>`:""}</div>
   <div class="qbody">${O.line===1?`<span class="ey">Was ist dort falsch?</span><div class="bricks" style="flex-direction:column">${B.map((b,i)=>`<button type="button" class="brick ${O.brick===i?(b[1]?"right":"wrong"):""}" data-brick="${i}">${b[0]}</button>`).join("")}</div>
   ${O.brick===0?`<div class="fb ok">Richtig. Ben hätte 5√3 herausbekommen.</div>`:O.brick!=null?`<div class="fb no">Das ist es nicht. Was passiert mit dem Mal in Zeile 2?</div>`:""}`:`<p class="sub">Tippe die Zeile an, in der Ben sich verrechnet hat.</p>`}</div></div>
  <div class="spacer"></div></section>${eddie(false)}${nextBtn("Weiter",O.brick!==0)}`},
 note:{t:"Transfer (AFB 3), automatisch auswertbar",p:["Neues Format „Fehler finden“: Zeile antippen, dann den passenden Begründungsbaustein wählen.","Kein Freitext, kein Sprachmodell. Zählt als Transferbeleg für „gemeistert“-Kandidaten."],r:"Konzept Session §6. Fehlbild „Produkt zu Summe“ aus dem LSA-Katalog."}},
{id:"o-recap",ctx:"ort",name:"Recap",render:()=>{
  const S=[["√(a · b) = √a · √b",true],["√(a + b) = √a + √b",false],["√72 = 6√2",true]];
  return `${otop(5)}<section class="card"><span class="ey">Recap · Stimmt das?</span><p class="prompt">Drei Aussagen zum Schluss. Für a, b ≥ 0.</p>
  <div class="stmts">${S.map((s,i)=>{const v=O.rec[i];const cls=O.recDone&&v!=null?(v===s[1]?"ok":"no"):"";
    return `<div class="stmt ${cls}"><span class="f">${s[0]}</span><div class="wf" role="group" aria-label="Aussage ${i+1}"><button type="button" data-rec="${i}:1" aria-pressed="${v===true}">stimmt</button><button type="button" data-rec="${i}:0" aria-pressed="${v===false}">stimmt nicht</button></div></div>`}).join("")}</div>
  ${O.recDone?`<div class="fb ${[0,1,2].every(i=>O.rec[i]===S[i][1])?"ok":"no"}">${[0,1,2].every(i=>O.rec[i]===S[i][1])?"Alles richtig. Gegenbeispiel zur zweiten: √(9 + 16) = 5, aber √9 + √16 = 7.":"Fast. Probier bei der zweiten: √(9 + 16) und √9 + √16."}</div>`:`<button type="button" class="btn btn-dark" id="recchk" style="align-self:flex-start"${Object.keys(O.rec).length<3?" disabled":""}>Prüfen</button>`}
  <div class="spacer"></div></section>${eddie(false)}${nextBtn("Zum Abschluss",!O.recDone)}`},
 note:{t:"Recap: Verständnis absichern",p:["2–3 Verständnisfragen zu den Skills der Stunde, ohne Hinweise.","Zählt nicht als Beleg. Der Coach sieht das Ergebnis neben dem Rest der Stunde."],r:"Konzept Session §3."}},
{id:"o-checkout",ctx:"ort",name:"Check-out",render:()=>`
  ${otop(6)}<div class="co">
   <div class="glasscard"><span class="ey">Heute geschafft</span>
    <div class="xprow"><span>Pfad · Level 4</span><b>+120 XP</b></div><div class="xpbar"><i style="--w:${O.xp?"72%":"48%"}"></i></div>
    <div class="sk"><span class="dot s"></span><span>Teilweise die Wurzel ziehen</span><small>sicher</small></div>

    <div class="coachline" style="margin-top:6px"><span class="av">LE</span><span>„Dein Üben zuhause hat sich gelohnt, Batu. Die Primfaktoren sitzen jetzt.“</span></div></div>
   <div class="glasscard"><span class="ey">Zuhause weiterüben</span><p class="t-md">Quests sind jederzeit offen.</p>
    <p class="t-sub" style="font-size:15px">Empfohlen bis zur nächsten Session:</p>
    <div class="sk"><span class="dot o"></span><span>Wurzeln addieren</span><small>neu</small></div>
    <div class="sk"><span class="dot s"></span><span>Teilweise die Wurzel ziehen</span><small>festigen</small></div>
    <p class="t-sub" style="font-size:14.5px">Was du übst, sieht dein Coach beim nächsten Mal.</p>
    <button type="button" class="btn btn-p" data-go="0" style="margin-top:8px">Fertig · Tablet zurückgeben</button></div>
  </div>${eddie(false)}`,
 after:()=>setTimeout(()=>{O.xp=true;const i=document.querySelector(".xpbar i");if(i)i.style.setProperty("--w","72%")},250),
 note:{t:"Check-out: Ergebnis vor Ort, Empfehlung für zuhause",p:["Primfaktoren sind jetzt „sicher“, weil Batu sie in der Session gezeigt hat. Daneben steht, dass er vorher dreimal zuhause geübt hat. So wird der Zusammenhang sichtbar, ohne dass zuhause etwas bewertet wurde.","Keine Quest-Tage mehr: Quests sind immer offen. Das System empfiehlt Themen, verpflichtet aber zu nichts.","„gemeistert“ gibt es nur nach Bestätigung durch den Coach."],r:"Entscheidung Rasit 27.10.: keine Quest-Tage, Üben jederzeit; Mastery nur vor Ort."}},

{id:"h-start",ctx:"home",tab:"start",name:"Start",render:()=>`

   ${O.q!=null?(O.q===right?`<div class="fb ok">Richtig. 2, 3 und 3 sind Primzahlen, und 2 · 3 · 3 = 18.</div><span class="xpfloat">+10 XP</span>`:`<div class="fb no">${O.q===1?"9 ist keine Primzahl. Die lässt sich noch zerlegen.":O.q===2?"6 ist keine Primzahl.":"Rechne nach: 2 · 3 · 6 ist 36."}<small>Probier es noch einmal.</small></div>`):""}

function stars(){
  const c=document.getElementById("stars");if(!c)return;const r=c.getBoundingClientRect();const k=2;
  c.width=c.offsetWidth*k;c.height=c.offsetHeight*k;const x=c.getContext("2d");let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<90;i++){const px=rnd()*c.width,py=rnd()*c.height*.7,rad=(rnd()*1.2+.3)*k;x.fillStyle=`rgba(255,248,230,${.15+rnd()*.5})`;x.beginPath();x.arc(px,py,rad,0,6.3);x.fill()}

  const rc=$("#recchk");if(rc)rc.onclick=()=>{O.recDone=true;render()};
  $$("[data-day]").forEach(b=>b.onclick=()=>{const v=b.dataset.day;if(O.days.has(v))O.days.delete(v);else if(O.days.size<2)O.days.add(v);render()});
  $$("[data-q]").forEach(b=>b.onclick=()=>{if(O.q===0)return;O.q=+b.dataset.q;render()});
  $$("[data-node]").forEach(b=>{const f=()=>{O.node=b.dataset.node;render()};b.onclick=f;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  const xs=$("#xsheet");if(xs)xs.onclick=()=>{O.node=null;render()};
  $$("[data-vopen]").forEach(b=>b.onclick=()=>{O.vOpen=true;P.beat=0;P.t=0;P.playing=false;render()});
  const vc=$("#vclose");if(vc)vc.onclick=()=>{O.vOpen=false;P.playing=false;render()};
  const ask=t=>{if(!t)return;O.chat.push({me:true,t});
    let r;
    if(O.coachQ){r={t:"Gemerkt. Dein Coach sieht deine Frage am Dienstag beim Check-in."};O.coachQ=false}
    else if(t==="Frage für meinen Coach"){r={t:"Schreib deine Frage unten hinein. Ich merke sie für die Session am Dienstag vor."};O.coachQ=true}
    else if(t==="Was soll ich heute üben?")r={t:"Am meisten bringt dir gerade Primfaktoren. Die waren in der Session noch nicht sicher und kommen in deiner Arbeit dran.",link:{go:"h-quest",ic:"▶",b:"Home Quest starten",s:"Primfaktoren · 5 Aufgaben · +50 XP"}};
    else if(/prim/i.test(t))r={t:"Primfaktoren gehören zu deinem Thema. In der Session waren sie noch nicht sicher.",link:{go:"h-baum",ic:"◆",b:"Themenbaum · Primfaktoren",s:"noch nicht sicher"}};
    else if(/wurzel|stehe/i.test(t))r={t:"Teilweise Wurzel ziehen sitzt. Bei den Primfaktoren bist du noch nicht sicher, dort fängst du am besten an.",link:{go:"h-baum",ic:"◆",b:"Themenbaum · Reelle Zahlen und Wurzeln",s:"Lv 2 · 2 von 3 sicher"}};
    else r={t:"Dazu finde ich kein Thema. Soll ich die Frage für deinen Coach merken? Tippe auf „Frage für meinen Coach“."};
    O.chat.push(r);render()};
  $$("[data-ask]").forEach(b=>b.onclick=()=>ask(b.dataset.ask));
  $$("[data-take]").forEach(b=>b.onclick=()=>{O.coachTake=b.dataset.take==="1";render()});
  $$("[data-pose]").forEach(b=>b.onclick=()=>{O.mePose=b.dataset.pose;render()});
  const ab=$("#askbtn");if(ab)ab.onclick=()=>ask($("#askin").value.trim());
  const ai=$("#askin");if(ai)ai.onkeydown=e=>{if(e.key==="Enter")ask(ai.value.trim())};
}
function chips(){
  const c=document.getElementById("chips");
  c.innerHTML=list().map((s,i)=>`<button type="button" class="chip" data-i="${i}" aria-current="${i===ST.i[ST.ctx]}"><span class="n">${i+1}</span>${s.name}</button>`).join("");
  c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ST.i[ST.ctx]=+b.dataset.i;reset();render()});
  const a=c.querySelector('[aria-current="true"]');if(a)a.scrollIntoView({block:"nearest",inline:"nearest"});
}
function notes(){
  const s=cur(),n=s.note;
  document.getElementById("notes").innerHTML=`<span class="ey">${s.ctx==="ort"?"Vor Ort · iPad":s.ctx==="coach"?"Coach · iPad":"Zuhause · Handy und Tablet"} · ${ST.i[ST.ctx]+1} von ${list().length}</span><h2>${n.t}</h2><ul>${n.p.map(p=>`<li>${p}</li>`).join("")}</ul><p class="rule">${n.r}</p>`;
}
function fit(){
  const dev=ST.ctx==="home"?ST.dev:"tablet",[w,h]=DIM[dev];const fw=w+24,fh=h+24;
  const st=document.getElementById("stage");const aw=st.clientWidth;
  const top=st.getBoundingClientRect().top+window.scrollY;
  const narrow=window.innerWidth<=980;
  const ah=narrow?window.innerHeight*.78:Math.max(320,window.innerHeight-top-20);
  const k=Math.min(aw/fw,ah/fh,1);
  const sc=document.getElementById("scaler");sc.style.width=fw*k+"px";sc.style.height=fh*k+"px";
  document.getElementById("frame").style.transform=`scale(${k})`;
}
document.getElementById("c-ort").onclick=()=>{ST.ctx="ort";reset();render()};
document.getElementById("c-home").onclick=()=>{ST.ctx="home";reset();render()};
document.getElementById("c-coach").onclick=()=>{ST.ctx="coach";reset();render()};
document.getElementById("d-tab").onclick=()=>{ST.dev="tablet";render()};
document.getElementById("d-phone").onclick=()=>{if(ST.ctx==="home"){ST.dev="phone";render()}};
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("nxt").onclick=()=>go(1);
document.getElementById("hints").onclick=e=>{ST.hints=!ST.hints;e.currentTarget.setAttribute("aria-pressed",ST.hints);document.getElementById("wrap").classList.toggle("nohints",!ST.hints);fit()};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
window.addEventListener("resize",fit);
render();
requestAnimationFrame(t=>{P.last=t;requestAnimationFrame(vidLoop)});
</script>
