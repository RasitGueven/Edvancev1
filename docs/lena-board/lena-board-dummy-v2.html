<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lena-Board v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Version 2 des Klick-Dummys. Gleiche Bausteine wie v1 (lena-board-dummy.html), Prüfkarte nach
   Bewertung-Lena-Board.md und Feldkatalog-Lena-Board.md umgebaut, echte Aufgaben aus den Chargen. */
:root{
  --navy:#102038; --navy-2:#1B2A4A;
  --primary:#334D7A; --primary-hover:#253D6A; --primary-light:#EEF2F8; --primary-line:#D3DCEA;
  --bg:#F7F7F5; --surface:#FFFFFF; --subtle:#EFEFED; --hover:#FAFAF8; --border:#E8E8E5; --line:#DCDCD8;
  --t1:#1A1A18; --t2:#4A4A47; --t3:#888884; --disabled:#B8B8B4;
  --ok:#2A8A4A; --ok-hover:#237A40; --ok-bg:#EAF5EE; --ok-line:#CDE6D6;
  --amb:#C87E00; --amb-hover:#A86A00; --amb-bg:#FEF3E2; --amb-line:#F1D9AE;
  --bad:#B91C1C; --bad-hover:#991818; --bad-bg:#FEF2F2; --bad-line:#F3C7C7;
  --gold:#DA9721;
  --hint-bg:#FBF6EA; --hint-line:#DA9721; --hint-ink:#8A5E10;
  --on-dark:#FFFFFF; --on-dark-2:rgba(255,255,255,.72); --glass:rgba(255,255,255,.12); --glass-line:rgba(255,255,255,.25);
  --scrim:rgba(16,32,56,.55);
  --sh-xs:0 1px 3px rgba(51,77,122,.06); --sh-md:0 4px 12px rgba(51,77,122,.10);
  --sh-lg:0 8px 24px rgba(51,77,122,.15); --sh-up:0 -4px 16px rgba(51,77,122,.08);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--t1);font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
kbd{font:inherit;font-size:11px;font-weight:500;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.6;line-height:1.5}
@media (hover:none){kbd{display:none}}

/* Kopfzeile */
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-inline:20px;padding-block:10px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-family:var(--f-display);font-size:21px;font-weight:500;color:var(--primary)}
.crumb{font-size:14px;color:var(--t2)}
.crumb b{color:var(--t1);font-weight:600}
.tright{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--t3)}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;color:var(--t2);cursor:pointer}
.sw .knob{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);transition:left .15s ease-out}
.sw[aria-pressed="true"]{border-color:var(--hint-line);color:var(--hint-ink)}
.sw[aria-pressed="true"] .knob{background:var(--hint-line)}
.sw[aria-pressed="true"] .knob::after{left:14px}
.tlink{border:none;background:none;color:var(--primary);cursor:pointer;font-size:13px;padding:4px 2px}
.tlink:hover{text-decoration:underline}
.vtag{font-size:11.5px;font-weight:600;color:var(--hint-ink);background:var(--hint-bg);border:1px solid var(--hint-line);border-radius:999px;padding:1px 8px}

.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 180px}
@media (max-width:600px){.wrap,.topbar{padding-inline:16px}}

/* Grundbausteine */
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--primary);color:var(--on-dark);border:1px solid var(--primary);
  border-radius:var(--r-md);padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:background .15s ease-out}
.btn:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);color:var(--t2);border-color:var(--line)}
.btn-ghost:hover{background:var(--subtle);color:var(--t1)}
.btn-sm{padding:6px 13px;font-size:13px}
.btn-big{padding:14px 26px;font-size:16px}
.btn-bad{background:var(--bad);border-color:var(--bad)} .btn-bad:hover{background:var(--bad-hover)}
.btn-amb{background:var(--amb);border-color:var(--amb)} .btn-amb:hover{background:var(--amb-hover)}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:14px;color:var(--t1);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:7px 10px}
textarea{width:100%;resize:vertical}
.hint{display:none;border:1.5px dashed var(--hint-line);background:var(--hint-bg);border-radius:var(--r-md);
  padding:9px 12px;font-size:13px;line-height:1.5;color:var(--t2);margin-top:12px}
.hint b{color:var(--hint-ink);font-weight:600;margin-right:4px}
.hint i{font-style:normal;font-weight:600;color:var(--hint-ink)}
.hint code{font-size:12px;background:rgba(218,151,33,.12);border-radius:4px;padding:0 4px}
body.hints .hint{display:block}

/* Übersicht */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:var(--r-xl);padding:22px 26px;
  color:var(--on-dark);box-shadow:var(--sh-lg)}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--on-dark-2);font-size:14px;max-width:66ch}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;margin-top:16px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh-md)}
.eyebrow{font-size:12px;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.what{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.3;margin:3px 0 2px;text-wrap:balance}
.nsub{font-size:14px;color:var(--t2)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pill{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--subtle);color:var(--t2);white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.amb{background:var(--amb-bg);color:var(--amb)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.chg{background:var(--primary-light);color:var(--primary)}
@media (max-width:640px){.next{grid-template-columns:minmax(0,1fr)} .next .btn-big{justify-content:center}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 12px}
.tab{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;
  color:var(--t2);cursor:pointer}
.tab span{opacity:.75;margin-left:6px;font-variant-numeric:tabular-nums}
.tab:hover{border-color:var(--primary);color:var(--primary)}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-dark);font-weight:600}

.topics{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.trow{display:grid;grid-template-columns:20px minmax(0,1fr) 150px 64px auto;gap:14px;align-items:center;
  padding:14px 18px;border-top:1px solid var(--subtle);cursor:pointer}
.topics > .trow:first-child{border-top:none}
.trow:hover{background:var(--hover)}
.chev{color:var(--t3);transition:transform .15s ease-out}
.trow.open .chev{transform:rotate(90deg)}
.tn{font-weight:500}
.tmeta{display:none;font-size:13px;color:var(--t3)}
.bar{height:6px;background:var(--subtle);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.b-ok{background:var(--ok)} .b-amb{background:var(--amb)} .b-bad{background:var(--bad)}
.count{font-variant-numeric:tabular-nums;color:var(--t2);font-size:14px;text-align:right}
@media (max-width:640px){
  .trow{grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:12px 14px}
  .trow .bar,.trow .count{display:none} .tmeta{display:block}
}
.tasks{background:var(--bg);border-top:1px solid var(--subtle);padding:4px 18px 10px 52px}
.task{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--border);padding:9px 4px;font-size:14px;cursor:pointer}
.task:hover .tt b{color:var(--primary);text-decoration:underline}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)} .dot.amb{background:var(--amb)} .dot.bad{background:var(--bad)}
.tt{min-width:0;display:flex;flex-direction:column}
.tt b{font-weight:500}
.tt small{font-size:12.5px;color:var(--t3)}
.st{margin-left:auto;font-size:12.5px;color:var(--t3);white-space:nowrap}
.st.ok{color:var(--ok)} .st.amb{color:var(--amb)} .st.bad{color:var(--bad)}
.tempty{font-size:13px;color:var(--t3);padding:10px 4px 2px}
@media (max-width:640px){.tasks{padding-left:16px;padding-right:12px}}

/* Prüfansicht */
.rhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;
  background:linear-gradient(135deg,var(--navy),var(--navy-2));border-radius:var(--r-xl);padding:14px 20px 16px;
  color:var(--on-dark);box-shadow:var(--sh-lg)}
.rmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--on-dark-2);font-size:12.5px}
.rhead h1{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25;margin:0}
.rhead .ib{border-color:var(--glass-line);background:var(--glass);color:var(--on-dark)}
.rnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pos{font-size:14px;color:var(--on-dark-2);margin-right:4px;font-variant-numeric:tabular-nums}
.pos b{color:var(--on-dark);font-size:17px}
.gbtn{background:var(--glass);border:1px solid var(--glass-line);color:var(--on-dark);border-radius:var(--r-md);
  padding:6px 12px;font-size:13px;cursor:pointer}
.gbtn:hover{background:rgba(255,255,255,.2)}
.gbtn:disabled{opacity:.35;cursor:default}
.rprog{grid-column:1/-1;height:4px;background:var(--glass);border-radius:2px;overflow:hidden}
.rprog i{display:block;height:100%;background:var(--gold);transition:width .2s ease-out}
@media (max-width:640px){.rhead{grid-template-columns:minmax(0,1fr)} .rnav{justify-content:flex-start}}

.done{border-radius:var(--r-md);padding:9px 14px;font-size:14px;margin-top:14px;background:var(--subtle);color:var(--t2)}
.done.ok{background:var(--ok-bg);color:var(--ok)}
.done.amb{background:var(--amb-bg);color:var(--amb)}
.done.bad{background:var(--bad-bg);color:var(--bad)}

.rgrid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;margin-top:16px;align-items:start}
@media (max-width:920px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);font-weight:600}

.pv{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-xs)}
@media (min-width:921px){.pv{position:sticky;top:16px}}
.pvhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pvframe{background:linear-gradient(160deg,var(--navy-2),var(--navy));border-radius:var(--r-lg);padding:16px;margin-top:10px}
.pvcard{background:var(--surface);border-radius:var(--r-md);padding:18px 20px}
.pvcard p{margin:0 0 6px}
.term{font-size:20px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:8px 0 4px!important}
.pvin{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px 14px;color:var(--t3);margin-top:12px;font-size:15px}
.pvunit{color:var(--t1);font-weight:600}
.pvrow{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:10px;align-items:center;margin-top:10px}
.pvrow .pvin{margin-top:0}
.pvrow b{font-variant-numeric:tabular-nums}
.pvopts{display:grid;gap:8px;margin-top:12px}
.pvopt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.pvopt b{color:var(--t3);font-weight:600}
.pvbtn{display:flex;justify-content:flex-end;margin-top:12px}
.pvbtn span{background:var(--glass);color:var(--on-dark-2);border-radius:999px;padding:8px 22px;font-weight:600;font-size:15px}
.art{font-size:13px;color:var(--t2);margin:12px 0 0}
.graph{display:block;width:100%;max-width:300px;height:auto;margin:8px 0}
.g-grid{stroke:var(--line);stroke-width:1}
.g-ax{stroke:var(--t2);stroke-width:1.5}
.g-line{stroke:var(--primary);stroke-width:2.5;stroke-linecap:round}
.g-t{fill:var(--t2);font-size:11px;font-family:var(--f-body)}
.g-f{fill:var(--primary);font-size:13px;font-weight:600;font-family:var(--f-body);font-style:italic}

.ck{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-xs);overflow:hidden}
.auff{background:var(--amb-bg);border-bottom:1px solid var(--amb-line);padding:12px 20px}
.auff b{color:var(--amb)}
.auff ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--t1)}
.sec{padding:16px 20px;border-top:1px solid var(--subtle)}
.sec:first-child,.auff + .sec{border-top:none}
.sec h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin:0 0 10px;font-weight:600;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{font-size:13px;color:var(--t2);margin:-4px 0 8px}
.chg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:600;
  color:var(--primary);background:var(--primary-light);border-radius:var(--r-sm);padding:1px 4px 1px 8px}
.chg button{border:none;background:none;color:var(--primary);cursor:pointer;font-size:12px;padding:0 4px;border-radius:4px;font-weight:500}
.chg button:hover{background:var(--primary-line)}
.sicher{display:inline-flex;align-items:center;font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:600;
  color:var(--amb);background:var(--amb-bg);border-radius:var(--r-sm);padding:1px 8px;white-space:nowrap}

.teil{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.teil.nolabel{display:block}
.tl{font-weight:600;color:var(--t2);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.chip .val{border:none;background:none;cursor:text;padding:5px 4px 5px 12px;font-weight:600}
.chip .x{border:none;background:none;color:var(--t3);cursor:pointer;width:28px;height:30px;border-radius:0 var(--r-md) var(--r-md) 0;font-size:16px}
.chip .x:hover{background:var(--bad-bg);color:var(--bad)}
.chip-in{width:9ch;font-size:16px!important;font-weight:600;padding:5px 10px!important;border-color:var(--primary)!important}
.addchip{border:1px dashed var(--line);background:none;border-radius:var(--r-md);padding:6px 12px;color:var(--primary);font-size:14px;cursor:pointer}
.addchip:hover{border-color:var(--primary);background:var(--primary-light)}
.spell{font-size:13px;color:var(--t3);margin:8px 0 0}

.regel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--t2)}
.regel select{min-width:0;max-width:100%}
.bereich{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--t2)}
.bereich input{width:8ch;font-weight:600;font-size:16px;text-align:center}
.bereich .bres{font-size:13.5px;color:var(--t3)}
.cbx{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:14px;color:var(--t2)}
.cbx input{margin-top:4px;flex:none}
.cbx small{display:block;font-size:12.5px;color:var(--t3)}
.cbx.off{color:var(--t3)}

.test{margin-top:12px}
.test label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--t3);margin-bottom:4px}
.tline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tline input{width:16ch}
.tline select{width:auto}
.tres{font-size:13.5px}
.tok{color:var(--ok);font-weight:600} .tno{color:var(--bad);font-weight:600} .tpa{color:var(--amb);font-weight:600} .tgr{color:var(--t3)}
.tfb{display:block;font-size:13px;color:var(--t2);margin-top:2px}

.mcl{display:grid;gap:6px}
.mco{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-md);padding:8px 12px;cursor:pointer;font-size:15px}
.mco:hover{border-color:var(--primary)}
.mco .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.mco.on{border-color:var(--ok);background:var(--ok-bg)}
.mco.on .radio{border:5px solid var(--ok)}
.mco b{color:var(--t3);font-weight:600}
.mcr{margin-left:auto;font-size:12.5px;color:var(--ok);font-weight:600}

.weg{margin-top:14px;font-size:14px;color:var(--t2);background:var(--bg);border-radius:var(--r-md);padding:10px 12px}
.wl{font-size:13px;color:var(--t3);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.weg p{margin:0;white-space:pre-line}
.link{border:none;background:none;color:var(--primary);cursor:pointer;font-size:13px;padding:0}
.link:hover{text-decoration:underline}

.fbrow{padding:10px 0;border-top:1px solid var(--subtle)}
.fbrow:first-of-type{border-top:none}
.fbhead{display:flex;gap:10px;align-items:flex-start}
.fbname{font-weight:600;font-size:14px;flex:1;min-width:0}
.fbwerte{font-size:14px;color:var(--t2);margin-top:3px;font-variant-numeric:tabular-nums}
.fbwerte b{color:var(--t1);font-weight:600}
.fbtext{font-size:13.5px;color:var(--t2);margin-top:2px}
.fbtext span{color:var(--t3)}
.fbrow.off .fbname,.fbrow.off .fbwerte,.fbrow.off .fbtext{text-decoration:line-through;color:var(--t3)}
.fbrow.off .fbwerte b{color:var(--t3)}
.neu{font-size:11.5px;color:var(--primary);background:var(--primary-light);border-radius:var(--r-sm);padding:0 6px;font-weight:600;margin-left:6px;vertical-align:1px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:4px 10px;font-size:13px;cursor:pointer;color:var(--t2);white-space:nowrap;flex:none}
.tog:hover{border-color:var(--bad-line);color:var(--bad);background:var(--bad-bg)}
.fbrow.off .tog:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.fform{display:grid;gap:8px;margin-top:10px;background:var(--bg);border-radius:var(--r-md);padding:12px}
.fform .frow{display:flex;gap:8px;flex-wrap:wrap}
.fform .frow > *{flex:1 1 140px;min-width:0}
.fform .fsmall{font-size:12.5px;color:var(--t3)}
.fform .facts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.perr{font-size:13px;color:var(--bad)}
.perr:empty{display:none}

.einrow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:start;margin-bottom:12px}
.einrow:last-child{margin-bottom:0}

.seg button{border:none;border-left:1px solid var(--line);background:var(--surface);padding:6px 14px;font-size:14px;cursor:pointer;color:var(--t2);font-variant-numeric:tabular-nums}
.seg button:first-child{border-left:none}
.seg button:hover{background:var(--subtle)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-dark);font-weight:600}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.ctl select{max-width:100%;min-width:0;width:100%}
.ctx{font-size:13px;color:var(--t2);margin-top:6px;line-height:1.5}
.ctx span{color:var(--t3)}
.ctxnote{font-size:13px;color:var(--primary);margin-top:4px}
.afbname{font-size:13px;color:var(--t3)}

.why{background:var(--primary-light);border-top:1px solid var(--primary-line);padding:14px 20px 16px}
.whyh{font-weight:600;color:var(--primary);font-size:14px}
.why ul{margin:4px 0 10px;padding-left:18px;font-size:13.5px;color:var(--t2)}

.dbtns{display:flex;gap:8px;flex-wrap:wrap}
.dbtn{display:inline-flex;gap:8px;align-items:center;border-radius:var(--r-md);padding:11px 18px;font-size:15px;font-weight:600;

/* Koordinatensystem wie der Generator koordinatensystem (task_figures): Gitter −5…5, Gerade y = m·x + b */
function graphSvg(m,b){
  const X=x=>20+(x+5)*22, Y=y=>20+(5-y)*22;
  let g="",lab="";
  for(let k=-5;k<=5;k++){g+=`<line class="g-grid" x1="${X(k)}" y1="${Y(-5)}" x2="${X(k)}" y2="${Y(5)}"/><line class="g-grid" x1="${X(-5)}" y1="${Y(k)}" x2="${X(5)}" y2="${Y(k)}"/>`;}
  for(const k of [-4,-2,2,4]){lab+=`<text class="g-t" x="${X(k)}" y="${Y(0)+14}" text-anchor="middle">${k<0?"−"+(-k):k}</text><text class="g-t" x="${X(0)-5}" y="${Y(k)+4}" text-anchor="end">${k<0?"−"+(-k):k}</text>`;}
  // Gerade auf das Fenster zuschneiden
  const pts=[];for(let x=-5;x<=5.0001;x+=0.01){const y=m*x+b;if(y>=-5&&y<=5)pts.push([x,y]);}
  const [p,q]=[pts[0],pts[pts.length-1]];
  const lx=Math.abs(m*3+b)<=4.5?3:-3, ly=m*lx+b;   // Beschriftung „f“ abseits der Achsen
  return `<svg class="graph" viewBox="0 0 260 260" role="img" aria-label="Koordinatensystem mit Gitter, eingezeichnet ist der Graph der linearen Funktion f.">${g}
    <line class="g-ax" x1="${X(-5)}" y1="${Y(0)}" x2="${X(5)}" y2="${Y(0)}"/><line class="g-ax" x1="${X(0)}" y1="${Y(-5)}" x2="${X(0)}" y2="${Y(5)}"/>
    ${lab}<text class="g-t" x="${X(5)-2}" y="${Y(0)-6}" text-anchor="end">x</text><text class="g-t" x="${X(0)+6}" y="${Y(5)+10}">y</text>
    <line class="g-line" x1="${X(p[0])}" y1="${Y(p[1])}" x2="${X(q[0])}" y2="${Y(q[1])}"/>
    <text class="g-f" x="${X(lx)+8}" y="${Y(ly)+4}">f</text></svg>`;
}

/* ================= Zustand ================= */
const clone=o=>JSON.parse(JSON.stringify(o));
function snap(a){return {teile:a.teile?a.teile.map(t=>t.werte.slice()):null,mc:a.typ==="mc"?a.mc:null,
  regel:{art:"wert",mitte:null,tol:null,einheit:false},
  fehler:a.fehler.map(f=>({fb:f.fb,werte:clone(f.werte),text:f.text,raus:false,neu:false})),fert:a.fert,afb:a.afb};}
let S=null;
function neu(){const h=S&&S.hints;
  S={view:"uebersicht",tab:"7/8",offen:{},idx:0,hints:!!h,
     tasks:AUFGABEN.map(a=>({orig:snap(a),cur:snap(a),entscheidung:null,gruende:[],notiz:"",warum:"",start:null,dauer:null}))};
  resetEphemeral();}
function resetEphemeral(){Object.assign(S,{panel:null,rot:[],rotText:"",unsicherText:"",edit:null,
  fehlerForm:false,focus:null,testOpen:false,testVal:"",testTeil:0,zoom:false});}
const cur=()=>S.tasks[S.idx].cur;

/* ================= Hilfen ================= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const minus=s=>String(s).replace(/-/g,"−");
const zeige=s=>esc(minus(s));
const liste=a=>a.length?a.map(minus).join(" / "):"keine";
const fmt=n=>{const r=Math.round(n*1000)/1000;return minus(String(r).replace(".",","));};
const hint=t=>`<div class="hint"><b>Hinweis</b>${t}</div>`;
const CHEV=`<svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
const summe=a=>a.reduce((x,y)=>x+y,0);
const fertLabel=k=>FERT[k]?FERT[k][0]:k;
const themaVon=k=>FERT[k]?FERT[k][1]:null;
const aThema=i=>themaVon(AUFGABEN[i].fert);              // Thema laut Vorbefüllung (Board-Ordnung)
const imThema=th=>AUFGABEN.map((a,i)=>i).filter(i=>aThema(i)===th);
const posImThema=i=>imThema(aThema(i)).indexOf(i)+1;
const idsStufe=s=>AUFGABEN.map((a,i)=>i).filter(i=>THEMA[aThema(i)].stufe===s);
const optText=(a,w)=>{const k="abcd".indexOf(w);return k>-1?`${w}) ${a.optionen[k]}`:w;};
function wertAnzeige(a,v){if(a.typ==="mc")return `<b>${esc(optText(a,v.w))}</b>`;
  if(a.typ==="teile"&&v.t!==null)return `${a.teile[v.t].label}: <b>${zeige(v.w)}</b>`;return `<b>${zeige(v.w)}</b>`;}
function regelText(r){if(r.art==="bereich")return `Bereich ${fmt(r.mitte-r.tol)} bis ${fmt(r.mitte+r.tol)}`;return "genau dieser Wert";}

/* ---- Wertung, nachgebaut wie lsa_grade / lsa_is_correct / lsa_fehlbild_match ---- */
const normText=s=>String(s).trim().toLowerCase().replace(/−/g,"-").replace(/\s+/g," ").replace(/,/g,".");
function parseZahl(s){
  const t=String(s).trim().replace(/−/g,"-").replace(/^([-+])\s+/,"$1");
  const m=t.match(/^([-+]?\d+(?:[.,]\d+)?(?:\/\d+)?)\s*(.*)$/);if(!m)return null;
  const rest=m[2].trim();if(rest&&!/^[a-zäöüß°%€²³ ]+$/i.test(rest))return null;
  let n=m[1].replace(",",".");let v;
  if(n.includes("/")){const [p,q]=n.split("/");v=parseFloat(p)/parseFloat(q);}else v=parseFloat(n);
  return isFinite(v)?{v,unit:rest}:null;}
// Schreibweisen, die das System zu einem Wert selbst ergänzt (Punkt, Plus, Einheit)
function varianten(w,einheit){const p=String(w).replace(",","."),out=new Set([w,p]);
  if(!/^[-−]/.test(w)){out.add("+"+w);out.add("+"+p);}
  if(einheit)for(const x of [...out]){out.add(x+" "+einheit);out.add(x+einheit);}
  return [...out];}
function erkannterFehler(a,c,k,ein){
  const n=normText(ein);
  for(const f of c.fehler){if(f.raus)continue;
    for(const v of f.werte){
      if(a.typ==="teile"&&v.t!==k)continue;
      if(varianten(v.w,a.einheit).some(x=>normText(x)===n))return f.fb;}}
  return null;}
function wertung(a,c,k,ein){
  const e=String(ein).trim();if(!e)return null;
  let res;
  if(a.typ==="teile"){
    const ok=c.teile[k].some(v=>normText(v)===normText(e));
    res={stufe:ok?"voll":"nicht",t:ok?"steht in der Liste":"steht nicht in der Liste"};
  }else{
    const r=c.regel,p=parseZahl(e);
    if(!p)return {stufe:"nicht",t:"keine Zahl erkannt",fb:erkannterFehler(a,c,k,e)};
    let ok;
    if(r.art==="bereich"){
      if(r.mitte===null||r.tol===null)return null;
      ok=Math.abs(p.v-r.mitte)<=r.tol+1e-9;
      res={stufe:ok?"voll":"nicht",t:ok?`liegt zwischen ${fmt(r.mitte-r.tol)} und ${fmt(r.mitte+r.tol)}`:`liegt nicht zwischen ${fmt(r.mitte-r.tol)} und ${fmt(r.mitte+r.tol)}`};
    }else{
      const hit=c.teile[0].find(v=>{const q=parseZahl(v);return q&&Math.abs(q.v-p.v)<1e-9;});
      ok=!!hit;res={stufe:ok?"voll":"nicht",t:ok?`gleicher Zahlenwert wie ${minus(hit)}`:"anderer Zahlenwert"};
    }
    if(ok&&r.einheit&&!a.einheit&&!p.unit)res={stufe:"teilweise",t:"Zahl stimmt, Einheit fehlt"};
  }
  if(res.stufe!=="voll")res.fb=erkannterFehler(a,c,k,e);
  return res;}

function auffaelligkeiten(i){
  const a=AUFGABEN[i],c=S.tasks[i].cur,L=[];
  if(a.typ==="zahl"){
    const w=a.weg,idx=Math.max(w.lastIndexOf("="),w.lastIndexOf("≈"));
    if(idx>-1){const m=w.slice(idx+1).match(/[-−+]?\s?\d+(?:[.,]\d+)?(?:\/\d+)?/);
      if(m){const r=wertung(a,c,0,m[0]);if(r&&r.stufe!=="voll")L.push(`Der Lösungsweg endet mit ${minus(m[0].trim())}. Das würde das System als falsch werten (${r.t}).`);}}
    c.fehler.forEach(f=>{if(f.raus)return;f.werte.forEach(v=>{const r=wertung(a,c,0,v.w);
      if(r&&r.stufe==="voll")L.push(`${minus(v.w)} steht als typischer Fehler, würde aber als richtig gewertet.`);});});
  }else if(a.typ==="teile"){
    c.fehler.forEach(f=>{if(f.raus)return;f.werte.forEach(v=>{if(c.teile[v.t].some(x=>normText(x)===normText(v.w)))
      L.push(`${a.teile[v.t].label}: ${minus(v.w)} steht als typischer Fehler und zugleich als richtige Antwort.`);});});
  }else{
    const r="abcd"[c.mc];
    if(c.fehler.some(f=>!f.raus&&f.werte.some(v=>v.w===r)))L.push(`Antwort ${r}) ist als richtig markiert und steht gleichzeitig bei den typischen Fehlern.`);
    "abcd".split("").forEach((o,k)=>{if(k===c.mc)return;
      if(!c.fehler.some(f=>!f.raus&&f.werte.some(v=>v.w===o)))L.push(`Antwort ${o}) „${a.optionen[k]}“ ist weder richtig noch einem Denkfehler zugeordnet. Wählt ein Kind sie, erfährt das System nichts darüber, woran es hakt.`);});
  }
  return L;}

function aenderungen(i){
  const a=AUFGABEN[i],t=S.tasks[i],o=t.orig,c=t.cur,L=[];
  if(a.typ==="mc"){if(o.mc!==c.mc)L.push(`Richtige Antwort: ${"abcd"[o.mc]}) → ${"abcd"[c.mc]})`);}
  else o.teile.forEach((ant,k)=>{if(JSON.stringify(ant)!==JSON.stringify(c.teile[k]))
    L.push(`Richtige Antwort${a.teile[k].label?" "+a.teile[k].label:""}: ${liste(ant)} → ${liste(c.teile[k])}`);});
  if(JSON.stringify(o.regel)!==JSON.stringify(c.regel)){
    if(o.regel.art!==c.regel.art||o.regel.mitte!==c.regel.mitte||o.regel.tol!==c.regel.tol)L.push(`Wertung: ${regelText(o.regel)} → ${regelText(c.regel)}`);
    if(o.regel.einheit!==c.regel.einheit)L.push(`Einheit muss dabei sein: ${o.regel.einheit?"ja":"nein"} → ${c.regel.einheit?"ja":"nein"}`);}
  c.fehler.forEach(f=>{const ws=f.werte.map(v=>a.typ==="mc"?v.w+")":(a.typ==="teile"?a.teile[v.t].label+": ":"")+minus(v.w)).join(" / ");
    if(f.raus&&!f.neu)L.push(`Typischer Fehler entfernt: ${FB[f.fb][0]} (${ws})`);
    if(f.neu)L.push(`Typischer Fehler ergänzt: ${ws} → ${FB[f.fb][0]}`);});
  if(o.fert!==c.fert)L.push(`Fertigkeit: ${fertLabel(o.fert)} → ${fertLabel(c.fert)}`);
  if(o.afb!==c.afb)L.push(`Anforderungsbereich: ${o.afb} → ${c.afb}`);
  return L;}
function statusOf(i){const t=S.tasks[i];
  if(!t.entscheidung)return{cls:"",label:"Offen"};
  if(t.entscheidung==="passt")return{cls:"ok",label:aenderungen(i).length?"Passt · geändert":"Passt"};
  if(t.entscheidung==="unsicher")return{cls:"amb",label:"Unsicher"};
  return{cls:"bad",label:"Passt nicht"};}
function blocker(i){const a=AUFGABEN[i],c=S.tasks[i].cur;
  if(a.typ==="mc")return null;
  if(c.regel.art==="bereich"){if(c.regel.mitte===null||c.regel.tol===null||c.regel.tol<=0)return"Bitte einen gültigen Bereich eintragen.";return null;}
  if(c.teile.some(x=>!x.length))return a.typ==="teile"?"Bitte für jede Teilfrage eine richtige Antwort eintragen.":"Bitte mindestens eine richtige Antwort eintragen.";
  return null;}
function naechsteOffene(nach){
  for(let j=nach+1;j<S.tasks.length;j++)if(!S.tasks[j].entscheidung)return j;
  for(let j=0;j<=nach&&j<S.tasks.length;j++)if(!S.tasks[j].entscheidung)return j;
  return -1;}
const zaehle=(e,ids)=>(ids||AUFGABEN.map((a,i)=>i)).filter(i=>S.tasks[i].entscheidung===e).length;

/* ================= Übersicht ================= */
function rUebersicht(){
  const fertig=S.tasks.filter(t=>t.entscheidung).length;
  const geaendert=S.tasks.filter((t,i)=>t.entscheidung&&aenderungen(i).length).length;
  const gesamt=summe(STUFEN.map(s=>summe(THEMEN[s].map(x=>x[2]))));

    const ids=imThema(key),demo=ids.length>0,open=!!S.offen[key];
    const c={p:zaehle("passt",ids),u:zaehle("unsicher",ids),x:zaehle("nicht",ids)};
    const d=c.p+c.u+c.x,pct=v=>(v/anz*100).toFixed(1)+"%";
    return `<div class="trow${open?" open":""}" role="button" tabindex="0" aria-expanded="${open}"
        onclick="toggleThema('${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();toggleThema('${key}')}">
      ${CHEV}<div class="tname"><div class="tn">${name}</div><div class="tmeta">${d} von ${anz} geprüft</div></div>

      <div class="count">${d} / ${anz}</div>
      <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();pruefeThema('${key}')">Prüfen</button>
    </div>${open?(demo?aufgabenListe(key,anz):`<div class="tasks"><div class="tempty">Im Dummy nicht befüllt.</div></div>`):""}`;
  }).join("");
  const tabZahl=s=>{const ids=idsStufe(s);return `${zaehle("passt",ids)+zaehle("unsicher",ids)+zaehle("nicht",ids)} / ${summe(THEMEN[s].map(x=>x[2]))}`;};
  const na=nx>=0?AUFGABEN[nx]:null;
  return `<section class="hero"><h1>Aufgaben prüfen</h1>
      <p>Lernstandsanalyse Mathe. Jede Aufgabe ist vorbefüllt: richtige Antwort, typische Fehler, Fertigkeit. Du schaust drüber, korrigierst, was nicht stimmt, und entscheidest mit einem Klick.</p></section>
    ${hint(`<i>Version 2 (04.10.2026).</i> Überarbeitet nach <code>Bewertung-Lena-Board.md</code> und <code>Feldkatalog-Lena-Board.md</code>. Das Original <code>lena-board-dummy.html</code> bleibt unverändert. Alle fünf Aufgaben stammen aus den Chargen k8-linfkt, k8-flaeche, k8-lgs und k9-kreis: Text, richtige Antworten, typische Fehler, Lösungsweg und Anforderungsbereich wie in der Datenbank. Eine Aufgabe ist absichtlich verfälscht, um die Auffälligkeiten zu zeigen. Themen und Stufen sind der echte Katalog (Kernlehrplan G9). Die Aufgabenzahlen bei Lineare Funktionen, Flächen, Gleichungssysteme und Kreis stammen aus den Chargen, die übrigen sind Beispielwerte.`)}
    <section class="next">
      <div><div class="eyebrow">${na?"Als Nächstes":"Geschafft"}</div>
        <div class="what">${na?`${THEMA[aThema(nx)].label} · Aufgabe ${posImThema(nx)} von ${THEMA[aThema(nx)].anz}`:"Alle Beispielaufgaben sind bewertet"}</div>
        <div class="nsub">${!na?"Im echten System ginge es hier mit dem nächsten Thema weiter.":fertig?"Du machst dort weiter, wo du aufgehört hast.":"Klasse 7/8, erstes Thema mit offenen Aufgaben."}</div>
        <div class="stats"><span class="pill"><b>${fertig}</b> von ${gesamt} geprüft</span>
          <span class="pill ok">Passt <b>${zaehle("passt")}</b></span>
          ${geaendert?`<span class="pill chg">geändert <b>${geaendert}</b></span>`:""}
          <span class="pill amb">Unsicher <b>${zaehle("unsicher")}</b></span>
          <span class="pill bad">Passt nicht <b>${zaehle("nicht")}</b></span></div></div>
      ${na?`<button class="btn btn-big" onclick="weiterPruefen()">Weiter prüfen <kbd>Enter</kbd></button>`
          :`<button class="btn btn-big btn-ghost" onclick="zuruecksetzen()">Dummy zurücksetzen</button>`}
    </section>
    ${hint(`<i>Geändert:</i> Klasse 9/10 ist ein eigener Reiter, weil die Chargen Kreis, Pythagoras, Potenzen usw. enthalten. Reihenfolge von „Weiter prüfen“: Stufe für Stufe (7/8, 9/10, 5/6; offene Frage 15), Themen in Lehrplan-Reihenfolge (<code>themen.sort</code>), im Thema nach Fertigkeit und Sondierrang. Übersprungene Aufgaben kommen am Ende wieder.`)}
    <div class="tabs" role="tablist">${STUFEN.map(s=>`<button class="tab" role="tab" aria-selected="${S.tab===s}" onclick="S.tab='${s}';render()">Klasse ${s}<span>${tabZahl(s)}</span></button>`).join("")}</div>

    ${hint(`<i>Geändert:</i> Ein Thema ist die Lehrplan-Gruppe der Fertigkeiten (<code>skill_thema</code>). Aufgeklappt steht unter jeder Aufgabe ihre Fertigkeit, denn für die steht die Aufgabe in der Lernstandsanalyse als Beleg. Die Zuordnung zum Thema kommt aus der Fertigkeit der Vorbefüllung. Ändert Lena die Fertigkeit, bleibt die Aufgabe bis zur Freigabe in ihrem Thema.`)}`;
}
function aufgabenListe(th,anz){
  const ids=imThema(th);
  return `<div class="tasks">${ids.map((i,n)=>{const st=statusOf(i);
    return `<button class="task" onclick="openTask(${i})"><span class="dot ${st.cls}"></span><span class="tt"><b>${n+1}. ${esc(AUFGABEN[i].titel)}</b><small>${esc(fertLabel(S.tasks[i].cur.fert))}</small></span><span class="st ${st.cls}">${st.label}</span></button>`;}).join("")}
    <div class="tempty">… und ${anz-ids.length} weitere Aufgaben (im Dummy nicht befüllt)</div></div>`;
}

/* ================= Prüfansicht ================= */

  if(!t.start)t.start=Date.now();
  const ids=imThema(aThema(i));
  const fertig=ids.filter(j=>S.tasks[j].entscheidung).length;
  return `<section class="rhead">
      <div><div class="rmeta">Klasse ${th.stufe} · Lernstandsanalyse Mathe · Erlaubt: ${HILFSMITTEL} ${ib("hilfsmittel","Hilfsmittel")}</div><h1>${th.label}</h1></div>
      <div class="rnav"><span class="pos">Aufgabe <b>${posImThema(i)}</b> von ${th.anz}</span>
        <button class="gbtn" onclick="geh(-1)" ${i===0?"disabled":""}>‹ Zurück</button>

        <button class="gbtn" onclick="pause()">Pause</button></div>
      <div class="rprog" title="${fertig} von ${th.anz} bewertet"><i style="width:${(fertig/th.anz*100).toFixed(1)}%"></i></div>
    </section>

      <div class="bk amb"><span>Unsicher</span><b>${zaehle("unsicher")}</b></div>
      <div class="bk bad"><span>Passt nicht</span><b>${zaehle("nicht")}</b></div>
      <div class="bk"><span>Noch offen</span><b>${offen}</b></div></div>
      ${avg!==null?`<p class="avg">Im Schnitt ${avg} ${avg===1?"Sekunde":"Sekunden"} pro Aufgabe.</p>`:""}
      <div class="eacts">${offen?`<button class="btn" onclick="weiterPruefen()">Offene Aufgaben prüfen</button>`:""}
        <button class="btn btn-ghost" onclick="pause(true)">Zur Übersicht</button></div>
      ${hint(`Wie in v1: Die gemessene Zeit pro Aufgabe ist die Grundlage für die Auswertung des Piloten. Sie gehört ins Prüfprotokoll (geprüft von, am, Dauer, Gründe, vorher → nachher). Für den Piloten die ersten 100 Aufgaben aus den neuen Chargen nehmen: einheitlich Zahl, mehrteilig und MC, alle mit typischen Fehlern.`)}
    </section>`;
}
function rZoom(){
  const a=AUFGABEN[S.idx];
  return `<div class="zoom" onclick="if(event.target===this){S.zoom=false;render();}"><div class="zbox" role="dialog" aria-label="Bild in groß">
    <div class="zhead"><span class="lbl">Bild in groß</span><button class="btn btn-sm btn-ghost" onclick="S.zoom=false;render()">Schließen</button></div>
    ${a.bild?graphSvg(a.bild.m,a.bild.b):""}</div></div>`;
}

/* ================= Erklärungen (ⓘ) ================= */
const tip=document.getElementById("tip"); let tipFor=null;
function zeigeTip(b){
  const html=INFO[b.dataset.tip]; if(!html)return;
  tip.innerHTML=html; tip.hidden=false; tipFor=b;
  const r=b.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  const vw=document.documentElement.clientWidth, vh=window.innerHeight;
  const left=Math.min(Math.max(12,r.left+r.width/2-w/2),vw-w-12);
  let top=r.bottom+8; if(top+h>vh-12)top=r.top-h-8;
  tip.style.left=left+"px"; tip.style.top=Math.max(12,top)+"px";
}
function versteckeTip(){tip.hidden=true;tipFor=null;}
document.addEventListener("pointerover",e=>{if(e.pointerType!=="mouse")return;
  const b=e.target.closest&&e.target.closest(".ib");if(b&&tipFor!==b)zeigeTip(b);});
document.addEventListener("pointerout",e=>{if(e.pointerType!=="mouse")return;
  const b=e.target.closest&&e.target.closest(".ib");if(b&&!b.contains(e.relatedTarget))versteckeTip();});
document.addEventListener("focusin",e=>{const b=e.target;if(b.classList&&b.classList.contains("ib")&&b.matches(":focus-visible"))zeigeTip(b);});
document.addEventListener("focusout",e=>{if(e.target===tipFor)versteckeTip();});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".ib");
  if(b){e.preventDefault();e.stopPropagation();zeigeTip(b);return;}
  if(!tip.hidden)versteckeTip();},true);
function tipNachziehen(){if(tip.hidden||!tipFor)return; if(!document.body.contains(tipFor))versteckeTip(); else zeigeTip(tipFor);}
window.addEventListener("scroll",tipNachziehen,{passive:true});
window.addEventListener("resize",tipNachziehen);

/* ================= Aktionen ================= */
function render(){
  versteckeTip();
  const app=document.getElementById("app"),bar=document.getElementById("dbar"),zoom=document.getElementById("zoom");
  document.body.classList.toggle("hints",!!S.hints);
  document.getElementById("sw-hints").setAttribute("aria-pressed",String(!!S.hints));
  if(S.view==="uebersicht"){app.innerHTML=rUebersicht();bar.hidden=true;}
  else if(S.view==="pruefen"){app.innerHTML=rPruefen();bar.innerHTML=rBar();bar.hidden=false;}
  else{app.innerHTML=rEnde();bar.hidden=true;}
  zoom.hidden=!(S.view==="pruefen"&&S.zoom); zoom.innerHTML=zoom.hidden?"":rZoom();
  fokus();
}
function renderBar(){versteckeTip();document.getElementById("dbar").innerHTML=rBar();fokus();}
function fokus(){
  const id=S.edit?"edit-in":S.focus; S.focus=null;
  if(!id)return; const el=document.getElementById(id);
  if(el&&document.activeElement!==el){el.focus();if(id==="edit-in")el.select();}
}
function toggleHints(){S.hints=!S.hints;render();}
function zuruecksetzen(){neu();render();window.scrollTo({top:0});toast("Dummy zurückgesetzt.");}
function toggleThema(id){S.offen[id]=!S.offen[id];render();}
function pruefeThema(th){const ids=imThema(th);
  if(!ids.length){toast("Dieses Thema ist im Dummy nicht befüllt.");return;}
  const offen=ids.find(i=>!S.tasks[i].entscheidung); openTask(offen!==undefined?offen:ids[0]);}
function weiterPruefen(){const nx=naechsteOffene(-1);
  if(nx<0){toast("Alle Beispielaufgaben sind bewertet.");return;} openTask(nx);}
function openTask(i){S.idx=i;S.view="pruefen";resetEphemeral();render();window.scrollTo({top:0});}
function geh(d){const j=S.idx+d;if(j<0)return;
  resetEphemeral(); if(j>=AUFGABEN.length)S.view="ende"; else S.idx=j;
  render();window.scrollTo({top:0});}
function pause(still){const th=aThema(S.idx);
  S.view="uebersicht";S.tab=THEMA[th].stufe;S.offen[th]=true;resetEphemeral();render();window.scrollTo({top:0});
  if(!still)toast("Pausiert. Dein Stand ist gespeichert.");}

function startEdit(k,j){S.edit={k,j};render();}
function editKey(e){
  if(e.key==="Enter"){e.preventDefault();e.stopPropagation();commitEdit(e.target.value);}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();S.edit=null;render();}
}
function commitEdit(v){
  if(!S.edit)return; const {k,j}=S.edit; S.edit=null;
  v=v.trim().replace(/−/g,"-").replace(/\s+/g," "); const arr=cur().teile[k];
  if(j==="neu"){if(v&&!arr.includes(v))arr.push(v);} else if(v)arr[j]=v; else arr.splice(j,1);
  render();
}
function loescheAntwort(k,j){cur().teile[k].splice(j,1);S.edit=null;render();}
function setMc(k){cur().mc=k;render();}
function setRegel(v){const c=cur();
  if(v==="bereich"){const p=parseZahl(c.teile[0][0]||"");const m=p?p.v:null;
    const tol=m===null?null:Math.abs(m)<=5?0.5:Math.abs(m)<=20?1:Math.round(Math.abs(m)*0.05*10)/10;
    c.regel={art:"bereich",mitte:m,tol,einheit:c.regel.einheit};}
  else c.regel={art:"wert",mitte:null,tol:null,einheit:c.regel.einheit};
  S.testVal="";render();}
function setBereich(f,v){const p=parseZahl(v);cur().regel[f]=p?(f==="tol"?Math.abs(p.v):p.v):null;render();}
function setEinheit(on){cur().regel.einheit=on;render();}
function testen(v){S.testVal=v;const el=document.getElementById("test-res");if(el)el.innerHTML=testRes();}
function fehlerRaus(k,v){const f=cur().fehler[k];if(f.neu&&v)cur().fehler.splice(k,1);else f.raus=v;render();}
function fehlerAdd(){
  const a=AUFGABEN[S.idx],err=document.getElementById("fe-err");
  const w=document.getElementById("fe-a").value.trim().replace(/−/g,"-");
  const fb=document.getElementById("fe-fb").value,x=document.getElementById("fe-x").value.trim();
  const t=a.typ==="teile"?+document.getElementById("fe-t").value:null;
  if(!w){err.textContent="Bitte die falsche Antwort eintragen.";return;}
  if(!fb){err.textContent="Bitte einen Denkfehler wählen.";return;}
  cur().fehler.push({fb,werte:[{t,w}],text:x,raus:false,neu:true});S.fehlerForm=false;render();
}
function setFert(k){cur().fert=k;render();}
function setAfb(x){cur().afb=x;render();}
function zuruecksetzenFeld(f){const t=S.tasks[S.idx],o=t.orig,c=t.cur;
  if(f==="antwort"){if(AUFGABEN[S.idx].typ==="mc")c.mc=o.mc;else c.teile=clone(o.teile);S.edit=null;}
  else if(f==="regel")c.regel=clone(o.regel);
  else if(f==="fehler")c.fehler=clone(o.fehler);
  else c[f]=o[f];
  render();}

function openPanel(p){S.panel=S.panel===p?null:p;S.focus=S.panel==="unsicher"?"uns-text":null;renderBar();}
function closePanel(){S.panel=null;S.rot=[];S.rotText="";S.unsicherText="";renderBar();}
function toggleRot(k){const x=S.rot.indexOf(k);if(x>-1)S.rot.splice(x,1);else S.rot.push(k);renderBar();}
function perr(t){const el=document.getElementById("perr");if(el)el.textContent=t;}
function speichernNicht(){
  if(!S.rot.length)return perr("Bitte mindestens einen Grund wählen.");
  if(S.rot.includes(ROT.length-1)&&!S.rotText.trim())return perr("Bei „Sonstiges“ bitte kurz beschreiben, was nicht stimmt.");
  entscheide("nicht",S.rot.slice().sort((a,b)=>a-b).map(k=>ROT[k]),S.rotText.trim());
}
function speichernUnsicher(){
  if(!S.unsicherText.trim())return perr("Bitte kurz schreiben, was dir unklar ist.");
  entscheide("unsicher",[],S.unsicherText.trim());
}
function passt(){if(blocker(S.idx))return;entscheide("passt",[],"");}
function entscheide(e,gruende,notiz){
  const i=S.idx,t=S.tasks[i];
  t.entscheidung=e;t.gruende=gruende;t.notiz=notiz;
  t.dauer=Math.max(1,Math.round((Date.now()-(t.start||Date.now()))/1000));t.start=null;
  const label=statusOf(i).label;
  resetEphemeral();
  const nx=naechsteOffene(i);
  if(nx>=0){S.idx=nx;S.view="pruefen";}else S.view="ende";
  render();window.scrollTo({top:0});
  toast(`${THEMA[aThema(i)].label}, Aufgabe ${posImThema(i)}: ${label}`,()=>{t.entscheidung=null;t.gruende=[];t.notiz="";S.idx=i;S.view="pruefen";resetEphemeral();render();window.scrollTo({top:0});});
}

let TT=null;
function toast(msg,undo){
  const el=document.getElementById("toast");
  el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button type="button" id="t-undo">Rückgängig</button>`:""}`;
  el.classList.toggle("low",S.view!=="pruefen"); el.hidden=false;
  if(undo)document.getElementById("t-undo").onclick=()=>{el.hidden=true;clearTimeout(TT);undo();};
  clearTimeout(TT);TT=setTimeout(()=>{el.hidden=true;},undo?5000:3000);
}

document.addEventListener("keydown",e=>{
  const ae=document.activeElement, tagName=ae?ae.tagName:"";
  const tippt=["INPUT","TEXTAREA","SELECT"].includes(tagName);
  if(e.key==="Escape"&&!tip.hidden){versteckeTip();return;}
  if(e.key==="Escape"&&S.zoom){S.zoom=false;render();return;}
  if(e.key==="Escape"){
    if(tippt){ae.blur();return;}
    if(S.view==="pruefen"){if(S.panel)closePanel();else pause();}
    return;
  }
  if(tippt||e.metaKey||e.ctrlKey||e.altKey||S.zoom)return;
  const aufKnopf=tagName==="BUTTON"||(ae&&ae.getAttribute&&ae.getAttribute("role")==="button");
  if(S.view==="pruefen"){
    if(S.panel)return;
    if(e.key==="1"){e.preventDefault();openPanel("nicht");}
    else if(e.key==="2"){e.preventDefault();openPanel("unsicher");}
    else if(e.key==="3"||(e.key==="Enter"&&!aufKnopf)){e.preventDefault();passt();}
    else if(e.key==="ArrowLeft"){geh(-1);}
    else if(e.key==="ArrowRight"){geh(1);}
  } else if(S.view==="uebersicht"&&e.key==="Enter"&&!aufKnopf){e.preventDefault();weiterPruefen();}
});

neu();render();
</script>
</body>
</html>
